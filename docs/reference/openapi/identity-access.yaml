components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token returned by the login endpoints, sent as `Authorization: Bearer <token>`."
    CookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: Access token cookie set by the browser login flows. Mutating requests also need the XSRF header.
  schemas:
    EngineConnectionMode:
      type: string
      enum:
        - direct
        - customer_sidecar
    EngineTenancyMode:
      type: string
      enum:
        - dedicated
        - shared
    ExternalProjectEngineTarget:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
          nullable: true
        projectId:
          type: string
        projectName:
          type: string
          nullable: true
        engineId:
          type: string
        engineName:
          type: string
          nullable: true
        engineBaseUrl:
          type: string
          nullable: true
        environment:
          type: object
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
            color:
              type: string
            manualDeployAllowed:
              type: boolean
          required:
            - id
            - name
            - color
            - manualDeployAllowed
        status:
          type: string
          enum:
            - active
            - disabled
            - archived
        source:
          type: string
          enum:
            - manual
            - legacy
            - ci
            - api
            - import
            - deployment_history
            - external
            - system
            - automation
            - config
        sourceRef:
          type: string
          nullable: true
        ownershipMode:
          type: string
          enum:
            - manual
            - config_locked
            - config_warn
        sourceHash:
          type: string
          nullable: true
        lastAppliedAt:
          type: number
          nullable: true
        driftStatus:
          type: string
          nullable: true
        externalSystemId:
          type: string
          nullable: true
        externalProjectId:
          type: string
          nullable: true
        externalEngineId:
          type: string
          nullable: true
        externalTargetId:
          type: string
          nullable: true
        allowManualDeploy:
          type: boolean
        allowCiDeploy:
          type: boolean
        allowApiDeploy:
          type: boolean
        allowImport:
          type: boolean
        createdById:
          type: string
          nullable: true
        approvedById:
          type: string
          nullable: true
        approvalStatus:
          type: string
          enum:
            - not_required
            - pending
            - approved
            - rejected
        approvedAt:
          type: number
          nullable: true
        policyTags:
          type: array
          items:
            type: string
        diagnostics:
          type: object
          nullable: true
          properties:
            source:
              type: string
              enum:
                - external_registration_api
                - config_bundle
                - manual
                - ci
                - api
                - import
                - system
                - automation
            owner:
              type: string
              minLength: 1
              maxLength: 255
            confidence:
              type: string
              enum:
                - low
                - medium
                - high
            externalSystemId:
              type: string
              minLength: 1
              maxLength: 255
            externalProjectId:
              type: string
              nullable: true
              minLength: 1
              maxLength: 255
            externalEngineId:
              type: string
              nullable: true
              minLength: 1
              maxLength: 255
            externalTargetId:
              type: string
              nullable: true
              minLength: 1
              maxLength: 255
          additionalProperties: false
        lastSeenAt:
          type: number
          nullable: true
        createdAt:
          type: number
        updatedAt:
          type: number
      required:
        - id
        - projectId
        - projectName
        - engineId
        - engineName
        - engineBaseUrl
        - environment
        - status
        - source
        - sourceRef
        - ownershipMode
        - sourceHash
        - lastAppliedAt
        - driftStatus
        - externalSystemId
        - externalProjectId
        - externalEngineId
        - externalTargetId
        - allowManualDeploy
        - allowCiDeploy
        - allowApiDeploy
        - allowImport
        - createdById
        - approvedById
        - approvalStatus
        - approvedAt
        - policyTags
        - diagnostics
        - lastSeenAt
        - createdAt
        - updatedAt
    IdentityMapping:
      type: object
      properties:
        providerKey:
          type: string
          minLength: 1
          maxLength: 160
        targetGroupKey:
          type: string
          minLength: 1
          maxLength: 160
        entitlementType:
          type: string
          enum:
            - group
            - role
            - attribute
            - authenticated
        externalId:
          type: string
          nullable: true
          minLength: 1
          maxLength: 2000
        matchOperator:
          type: string
          enum:
            - exact
            - contains
            - exists
        syncMode:
          type: string
          enum:
            - additive
            - authoritative
        id:
          type: string
        providerId:
          type: string
        targetGroupId:
          type: string
        isActive:
          type: boolean
        configKey:
          type: string
          nullable: true
        sourceRef:
          type: string
          nullable: true
        ownershipMode:
          type: string
          enum:
            - manual
            - config_locked
            - config_warn
      required:
        - providerKey
        - targetGroupKey
        - entitlementType
        - externalId
        - matchOperator
        - syncMode
        - id
        - providerId
        - targetGroupId
        - isActive
        - configKey
        - sourceRef
        - ownershipMode
    IdentityProvider:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
          nullable: true
        key:
          type: string
          minLength: 1
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 255
        organization:
          type: string
          nullable: true
        displayOrder:
          type: integer
          minimum: 0
          maximum: 10000
        isPreferred:
          type: boolean
        loginDomainsJson:
          type: string
        protocol:
          type: string
          enum:
            - oidc
            - saml
            - ldap
        isEnabled:
          type: boolean
        authenticationMode:
          type: string
          enum:
            - direct
            - claims_only
        directoryTenantId:
          type: string
          nullable: true
        ownershipMode:
          type: string
          maxLength: 64
        sourceRef:
          type: string
          nullable: true
        configurationJson:
          type: string
        syncJson:
          type: string
        createdAt:
          type: number
        updatedAt:
          type: number
      required:
        - id
        - tenantId
        - key
        - displayName
        - organization
        - displayOrder
        - isPreferred
        - loginDomainsJson
        - protocol
        - isEnabled
        - authenticationMode
        - directoryTenantId
        - ownershipMode
        - sourceRef
        - configurationJson
        - syncJson
        - createdAt
        - updatedAt
    IdentityProviderRequest:
      oneOf:
        - type: object
          properties:
            key:
              type: string
              minLength: 1
              maxLength: 128
            displayName:
              type: string
              minLength: 1
              maxLength: 255
            organization:
              type: string
              nullable: true
              minLength: 1
              maxLength: 255
            displayOrder:
              type: integer
              minimum: 0
              maximum: 10000
            isPreferred:
              type: boolean
            loginDomains:
              type: array
              items:
                type: string
                maxLength: 253
                pattern: ^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
              maxItems: 20
            isEnabled:
              type: boolean
            authenticationMode:
              type: string
              enum:
                - direct
                - claims_only
            directoryTenantId:
              type: string
              nullable: true
            sync:
              type: object
              properties:
                triggers:
                  type: array
                  items:
                    type: string
                    enum:
                      - login
                      - scheduled
                      - manual
                  minItems: 1
                intervalSeconds:
                  type: integer
                  minimum: 60
                  maximum: 86400
                requiredForLogin:
                  type: boolean
                  enum:
                    - true
                  default: true
                incompleteEntitlements:
                  type: string
                  enum:
                    - fail_closed
                  default: fail_closed
                connectorCapability:
                  type: string
                  enum:
                    - claim_only
                    - ldap_directory
                  default: claim_only
                scheduled:
                  type: boolean
                  default: false
              required:
                - triggers
              additionalProperties: false
            ownershipMode:
              type: string
              maxLength: 64
            sourceRef:
              type: string
              nullable: true
            protocol:
              type: string
              enum:
                - oidc
            configuration:
              $ref: "#/components/schemas/OidcIdentityProviderConfiguration"
          required:
            - key
            - protocol
            - configuration
          additionalProperties: false
        - type: object
          properties:
            key:
              type: string
              minLength: 1
              maxLength: 128
            displayName:
              type: string
              minLength: 1
              maxLength: 255
            organization:
              type: string
              nullable: true
              minLength: 1
              maxLength: 255
            displayOrder:
              type: integer
              minimum: 0
              maximum: 10000
            isPreferred:
              type: boolean
            loginDomains:
              type: array
              items:
                type: string
                maxLength: 253
                pattern: ^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
              maxItems: 20
            isEnabled:
              type: boolean
            authenticationMode:
              type: string
              enum:
                - direct
                - claims_only
            directoryTenantId:
              type: string
              nullable: true
            sync:
              type: object
              properties:
                triggers:
                  type: array
                  items:
                    type: string
                    enum:
                      - login
                      - scheduled
                      - manual
                  minItems: 1
                intervalSeconds:
                  type: integer
