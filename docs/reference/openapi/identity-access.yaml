openapi: 3.0.3
info:
  title: EnterpriseGlue Identity & Access API
  version: 0.1.0
  description: |-
    Identity providers, provisioning directories, identity mappings, users, roles, groups, policies, permissions and API clients.

    Tenant-scoped routes under `/api/t/{tenantSlug}/...` are also served at the legacy alias `/t/{tenantSlug}/api/...`; only the first form is documented.
servers:
  - url: /
    description: This EnterpriseGlue deployment
tags:
  - name: Identity & Access
    description: Identity providers, provisioning directories, identity mappings, users, roles, groups, policies, permissions and API clients.
paths:
  /api/identity/providers:
    get:
      operationId: getIdentityProviders
      tags:
        - Identity & Access
      responses:
        "200":
          description: List identity providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IdentityProvider"
      security:
        - BearerAuth: []
        - CookieAuth: []
    post:
      operationId: postIdentityProviders
      tags:
        - Identity & Access
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityProviderRequest"
      responses:
        "201":
          description: Identity provider created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProvider"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/identity/providers/{key}/external-identities/unlink:
    post:
      operationId: postIdentityProvidersByKeyExternalIdentitiesUnlink
      tags:
        - Identity & Access
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 128
          required: true
          name: key
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subjectId:
                  type: string
                  minLength: 1
                  maxLength: 2000
                userId:
                  type: string
                  minLength: 1
                  maxLength: 128
                confirmation:
                  type: string
                  enum:
                    - UNLINK_EXTERNAL_IDENTITY
              required:
                - subjectId
                - userId
                - confirmation
      responses:
        "200":
          description: Explicitly unlink a conflicting provider subject without reassigning it to another account
          content:
            application/json:
              schema:
                type: object
                properties:
                  identityId:
                    type: string
                    minLength: 1
                  providerManagedMembershipsRemoved:
                    type: integer
                    minimum: 0
                  normalizedIdentitiesMarked:
                    type: integer
                    minimum: 0
                  providerRefreshSessionsRevoked:
                    type: integer
                    minimum: 0
                  recovery:
                    type: string
                    enum:
                      - verified_sign_in_required
                required:
                  - identityId
                  - providerManagedMembershipsRemoved
                  - normalizedIdentitiesMarked
                  - providerRefreshSessionsRevoked
                  - recovery
        "400":
          description: The requested link cannot be unlinked
        "404":
          description: Identity provider or external identity not found
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/identity/providers/{key}:
    get:
      operationId: getIdentityProvidersByKey
      tags:
        - Identity & Access
      parameters:
        - schema:
            type: string
          required: true
          name: key
          in: path
      responses:
        "200":
          description: Identity provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProvider"
        "404":
          description: Identity provider not found
      security:
        - BearerAuth: []
        - CookieAuth: []
    put:
      operationId: putIdentityProvidersByKey
      tags:
        - Identity & Access
      parameters:
        - schema:
            type: string
          required: true
          name: key
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityProviderUpdate"
      responses:
        "200":
          description: Identity provider updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProvider"
        "404":
          description: Identity provider not found
      security:
        - BearerAuth: []
        - CookieAuth: []
    delete:
      operationId: deleteIdentityProvidersByKey
      tags:
        - Identity & Access
      parameters:
        - schema:
            type: string
          required: true
          name: key
          in: path
      responses:
        "204":
          description: Identity provider archived
        "404":
          description: Identity provider not found
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/identity/providers/{key}/sync-runs:
    get:
      operationId: getIdentityProvidersByKeySyncRuns
      tags:
        - Identity & Access
      parameters:
        - schema:
            type: string
          required: true
          name: key
          in: path
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Recent identity provider synchronization runs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      minLength: 1
                    tenantId:
                      type: string
                      nullable: true
                    providerId:
                      type: string
                      nullable: true
                    userId:
                      type: string
                      nullable: true
                    trigger:
                      type: string
                      enum:
                        - login
                        - scheduled
                        - manual
                        - mapping_change
                        - engine_change
                    status:
                      type: string
                      enum:
                        - running
                        - success
                        - failed
                    startedAt:
                      type: integer
                      minimum: 0
                    completedAt:
                      type: integer
                      nullable: true
                      minimum: 0
                    groupMembershipsCreated:
                      type: integer
                      minimum: 0
                    groupMembershipsUpdated:
                      type: integer
                      minimum: 0
                    groupMembershipsRemoved:
                      type: integer
                      minimum: 0
                    assignmentsCreated:
                      type: integer
                      minimum: 0
                    assignmentsUpdated:
                      type: integer
                      minimum: 0
                    assignmentsRemoved:
                      type: integer
                      minimum: 0
                    errorCode:
                      type: string
                      nullable: true
                    errorMessage:
                      type: string
                      nullable: true
                    details:
                      type: string
                  required:
                    - id
                    - tenantId
                    - providerId
                    - userId
                    - trigger
                    - status
                    - startedAt
                    - completedAt
                    - groupMembershipsCreated
                    - groupMembershipsUpdated
                    - groupMembershipsRemoved
                    - assignmentsCreated
                    - assignmentsUpdated
                    - assignmentsRemoved
                    - errorCode
                    - errorMessage
                    - details
                  additionalProperties: false
        "404":
          description: Identity provider not found
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/identity/providers/{key}/sync-runs/{runId}/events:
    get:
      operationId: getIdentityProvidersByKeySyncRunsByRunIdEvents
      tags:
        - Identity & Access
      parameters:
        - schema:
            type: string
          required: true
          name: key
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 128
          required: true
          name: runId
          in: path
        - schema:
            type: string
            enum:
              - info
              - warning
              - error
          required: false
          name: severity
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Provider-scoped synchronization events for one run
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      minLength: 1
                    tenantId:
                      type: string
                      nullable: true
                    providerId:
                      type: string
                      nullable: true
                    runId:
                      type: string
                      minLength: 1
                    severity:
                      type: string
                      enum:
                        - info
                        - warning
                        - error
                    type:
                      type: string
                      minLength: 1
                    userId:
                      type: string
                      nullable: true
                    mappingType:
                      type: string
                      nullable: true
                    mappingId:
                      type: string
                      nullable: true
                    resourceType:
                      type: string
                      nullable: true
                    resourceId:
                      type: string
                      nullable: true
                    message:
                      type: string
                    details:
                      type: string
                    createdAt:
                      type: integer
                      minimum: 0
                  required:
                    - id
                    - tenantId
                    - providerId
                    - runId
                    - severity
                    - type
                    - userId
                    - mappingType
                    - mappingId
                    - resourceType
                    - resourceId
                    - message
                    - details
                    - createdAt
                  additionalProperties: false
        "404":
          description: Identity provider not found
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/identity/provider-secrets:
    post:
      operationId: postIdentityProviderSecrets
      tags:
        - Identity & Access
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                  minLength: 1
                  maxLength: 262144
                purpose:
                  type: string
                  enum:
                    - oidc.client_secret
                    - oidc.apple_private_key
                    - saml.metadata_xml
                    - saml.idp_signing_certificate
                    - saml.request_signing_private_key
                    - saml.request_signing_certificate
                    - ldap.bind_password
                    - ldap.tls_trust_certificate
              required:
                - value
                - purpose
              additionalProperties: false
      responses:
        "400":
          description: A tenant-scoped route is required for secret provisioning
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/identity/provider-secrets/retire:
    post:
      operationId: postIdentityProviderSecretsRetire
      tags:
        - Identity & Access
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmation:
                  type: string
                  enum:
                    - RETIRE_IDENTITY_PROVIDER_SECRET
                purpose:
                  type: string
                  enum:
                    - oidc.client_secret
                    - oidc.apple_private_key
                    - saml.metadata_xml
                    - saml.idp_signing_certificate
                    - saml.request_signing_private_key
                    - saml.request_signing_certificate
                    - ldap.bind_password
                    - ldap.tls_trust_certificate
                reference:
                  type: string
                  minLength: 1
                  maxLength: 512
                  pattern: ^[A-Za-z][A-Za-z0-9_.:/-]*$
              required:
                - confirmation
                - purpose
                - reference
              additionalProperties: false
      responses:
        "400":
          description: A tenant-scoped route is required for secret retirement
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/identity/providers/{key}/secrets/{purpose}:
    put:
      operationId: putIdentityProvidersByKeySecretsByPurpose
      tags:
        - Identity & Access
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 128
          required: true
          name: key
          in: path
        - schema:
            type: string
            enum:
              - oidc.client_secret
              - oidc.apple_private_key
              - saml.metadata_xml
              - saml.idp_signing_certificate
              - saml.request_signing_private_key
              - saml.request_signing_certificate
              - ldap.bind_password
              - ldap.tls_trust_certificate
          required: true
          name: purpose
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                  minLength: 1
                  maxLength: 262144
              required:
                - value
              additionalProperties: false
      responses:
        "400":
          description: A tenant-scoped route is required for secret rotation
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/identity/providers/{key}/secrets/{purpose}/availability:
    get:
      operationId: getIdentityProvidersByKeySecretsByPurposeAvailability
      tags:
        - Identity & Access
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 128
          required: true
          name: key
          in: path
        - schema:
            type: string
            enum:
              - oidc.client_secret
              - oidc.apple_private_key
              - saml.metadata_xml
              - saml.idp_signing_certificate
              - saml.request_signing_private_key
              - saml.request_signing_certificate
              - ldap.bind_password
              - ldap.tls_trust_certificate
          required: true
          name: purpose
          in: path
      responses:
        "400":
          description: A tenant-scoped route is required for secret availability checks
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/identity/providers/{key}/secrets/{purpose}/retire:
    post:
      operationId: postIdentityProvidersByKeySecretsByPurposeRetire
      tags:
        - Identity & Access
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 128
          required: true
          name: key
          in: path
        - schema:
            type: string
            enum:
              - oidc.client_secret
              - oidc.apple_private_key
              - saml.metadata_xml
              - saml.idp_signing_certificate
              - saml.request_signing_private_key
              - saml.request_signing_certificate
              - ldap.bind_password
              - ldap.tls_trust_certificate
          required: true
          name: purpose
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmation:
                  type: string
                  enum:
                    - RETIRE_IDENTITY_PROVIDER_SECRET
              required:
                - confirmation
              additionalProperties: false
      responses:
        "400":
          description: A tenant-scoped route is required for secret retirement
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/identity/providers/{key}/reconcile:
    post:
      operationId: postIdentityProvidersByKeyReconcile
      tags:
        - Identity & Access
      parameters:
        - schema:
            type: string
          required: true
          name: key
          in: path
      responses:
        "200":
          description: Run one bounded LDAP directory reconciliation page
          content:
            application/json:
              schema:
                type: object
                properties:
                  skipped:
                    type: string
                  processed:
                    type: integer
                  runId:
                    type: string
                    nullable: true
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/identity/providers/{key}/reconciliation-preview:
    post:
      operationId: postIdentityProvidersByKeyReconciliationPreview
      tags:
        - Identity & Access
      parameters:
        - schema:
            type: string
          required: true
          name: key
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 5000
                cursor:
                  type: string
                  minLength: 1
                  maxLength: 512
      responses:
        "200":
          description: Preview stored identity snapshot membership changes without persistence
          content:
            application/json:
              schema:
                type: object
                properties:
                  scanned:
                    type: integer
                    minimum: 0
                  additions:
                    type: integer
                    minimum: 0
                  removals:
                    type: integer
                    minimum: 0
                  unchanged:
                    type: integer
                    minimum: 0
                  failed:
                    type: integer
                    minimum: 0
                  truncated:
                    type: boolean
                  nextCursor:
                    type: string
                    nullable: true
                  latestSnapshotAt:
                    type: number
                    nullable: true
                  warnings:
                    type: array
                    items:
                      type: string
                      enum:
                        - stored_snapshots_only
                        - no_active_snapshots
                        - truncated
                  mappings:
                    type: array
                    items:
                      type: object
                      properties:
                        mappingId:
                          type: string
                        targetGroupId:
                          type: string
                        additions:
                          type: integer
                          minimum: 0
                        removals:
                          type: integer
                          minimum: 0
                        unchanged:
                          type: integer
                          minimum: 0
                      required:
                        - mappingId
                        - targetGroupId
                        - additions
                        - removals
                        - unchanged
                required:
                  - scanned
                  - additions
                  - removals
                  - unchanged
                  - failed
                  - truncated
                  - nextCursor
                  - latestSnapshotAt
                  - warnings
                  - mappings
        "404":
          description: Identity provider not found
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/identity/providers/{key}/replay-memberships:
    post:
      operationId: postIdentityProvidersByKeyReplayMemberships
      tags:
        - Identity & Access
      parameters:
        - schema:
            type: string
          required: true
          name: key
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 5000
                cursor:
                  type: string
                  minLength: 1
                  maxLength: 512
      responses:
        "200":
          description: Replay stored provider identity memberships
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string
                    nullable: true
                  scanned:
                    type: integer
                    minimum: 0
                  created:
                    type: integer
                    minimum: 0
                  removed:
                    type: integer
                    minimum: 0
                  failed:
                    type: integer
                    minimum: 0
                  truncated:
                    type: boolean
                  nextCursor:
                    type: string
                    nullable: true
                required:
                  - runId
                  - scanned
                  - created
                  - removed
                  - failed
                  - truncated
                  - nextCursor
        "404":
          description: Identity provider not found
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/identity/providers/{key}/test-connection:
    post:
      operationId: postIdentityProvidersByKeyTestConnection
      tags:
        - Identity & Access
      parameters:
        - schema:
            type: string
          required: true
          name: key
          in: path
      responses:
        "200":
          description: Protocol-specific identity provider reachability result; OIDC/SAML metadata checks do not prove a complete sign-in
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - metadata_reachable
                      protocol:
                        type: string
                        enum:
                          - oidc
                      issuer:
                        type: string
                    required:
                      - status
                      - protocol
                      - issuer
                  - type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - metadata_reachable
                      protocol:
                        type: string
                        enum:
                          - saml
                      entityDescriptorCount:
                        type: integer
                        minimum: 0
                    required:
                      - status
                      - protocol
                      - entityDescriptorCount
                  - type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - connected
                      protocol:
                        type: string
                        enum:
                          - ldap
                      sampledIdentities:
                        type: integer
                        minimum: 0
                    required:
                      - status
                      - protocol
                      - sampledIdentities
        "404":
          description: Identity provider not found
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/t/{tenantSlug}/identity/providers:
    get:
      operationId: getTByTenantSlugIdentityProviders
      tags:
        - Identity & Access
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
          required: true
          name: tenantSlug
          in: path
      responses:
        "200":
          description: Identity providers owned by the current tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IdentityProvider"
      security:
        - BearerAuth: []
        - CookieAuth: []
    post:
      operationId: postTByTenantSlugIdentityProviders
      tags:
        - Identity & Access
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
          required: true
          name: tenantSlug
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityProviderRequest"
      responses:
        "201":
          description: Tenant identity provider created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProvider"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/t/{tenantSlug}/identity/provider-secrets:
    post:
      operationId: postTByTenantSlugIdentityProviderSecrets
      tags:
        - Identity & Access
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
          required: true
          name: tenantSlug
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                  minLength: 1
                  maxLength: 262144
                purpose:
                  type: string
                  enum:
                    - oidc.client_secret
                    - oidc.apple_private_key
                    - saml.metadata_xml
                    - saml.idp_signing_certificate
                    - saml.request_signing_private_key
                    - saml.request_signing_certificate
                    - ldap.bind_password
                    - ldap.tls_trust_certificate
              required:
                - value
                - purpose
              additionalProperties: false
      responses:
        "201":
          description: Tenant-bound secret provisioned without returning its value
          content:
            application/json:
              schema:
                type: object
                properties:
                  purpose:
                    type: string
                    enum:
                      - oidc.client_secret
                      - oidc.apple_private_key
                      - saml.metadata_xml
                      - saml.idp_signing_certificate
                      - saml.request_signing_private_key
                      - saml.request_signing_certificate
                      - ldap.bind_password
                      - ldap.tls_trust_certificate
                  reference:
                    type: string
                    minLength: 1
                    maxLength: 512
                    pattern: ^[A-Za-z][A-Za-z0-9_.:/-]*$
                  version:
                    type: string
                    nullable: true
                  updatedAt:
                    type: integer
                    minimum: 0
                  previousRetired:
                    type: boolean
                required:
                  - purpose
                  - reference
                  - version
                  - updatedAt
                  - previousRetired
                additionalProperties: false
        "503":
          description: Tenant secret broker unavailable
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/t/{tenantSlug}/identity/provider-secrets/retire:
    post:
      operationId: postTByTenantSlugIdentityProviderSecretsRetire
      tags:
        - Identity & Access
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
          required: true
          name: tenantSlug
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmation:
                  type: string
                  enum:
                    - RETIRE_IDENTITY_PROVIDER_SECRET
                purpose:
                  type: string
                  enum:
                    - oidc.client_secret
                    - oidc.apple_private_key
                    - saml.metadata_xml
                    - saml.idp_signing_certificate
                    - saml.request_signing_private_key
                    - saml.request_signing_certificate
                    - ldap.bind_password
                    - ldap.tls_trust_certificate
                reference:
                  type: string
                  minLength: 1
                  maxLength: 512
                  pattern: ^[A-Za-z][A-Za-z0-9_.:/-]*$
              required:
                - confirmation
                - purpose
                - reference
              additionalProperties: false
      responses:
        "200":
          description: Unattached tenant-bound secret retired
          content:
            application/json:
              schema:
                type: object
                properties:
                  purpose:
                    type: string
                    enum:
                      - oidc.client_secret
                      - oidc.apple_private_key
                      - saml.metadata_xml
                      - saml.idp_signing_certificate
                      - saml.request_signing_private_key
                      - saml.request_signing_certificate
                      - ldap.bind_password
                      - ldap.tls_trust_certificate
                  retired:
                    type: boolean
                  retiredAt:
                    type: integer
                    minimum: 0
                  providerDisabled:
                    type: boolean
                    enum:
                      - true
                required:
                  - purpose
                  - retired
                  - retiredAt
                additionalProperties: false
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/t/{tenantSlug}/identity/providers/{key}:
    get:
      operationId: getTByTenantSlugIdentityProvidersByKey
      tags:
