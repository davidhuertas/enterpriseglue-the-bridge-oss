  /scim/v2/{directoryKey}/Users:
    get:
      operationId: getScimV2ByDirectoryKeyUsers
      tags:
        - SCIM
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[a-z][a-z0-9._-]*$
          required: true
