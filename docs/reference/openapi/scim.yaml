                      type: object
                      properties:
                        schemas:
                          type: array
                          items:
                            type: string
                            enum:
                              - urn:ietf:params:scim:schemas:core:2.0:Schema
                          minItems: 1
                          maxItems: 1
                        id:
                          type: string
                          minLength: 1
                          maxLength: 512
                        name:
                          type: string
                          minLength: 1
                          maxLength: 255
                        description:
                          type: string
                          maxLength: 1000
                        attributes:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                minLength: 1
                                maxLength: 255
                              type:
                                type: string
                                enum:
                                  - string
                                  - boolean
                                  - decimal
                                  - integer
                                  - dateTime
                                  - reference
                                  - complex
                              multiValued:
                                type: boolean
                              description:
                                type: string
                                maxLength: 1000
                              required:
                                type: boolean
                              caseExact:
                                type: boolean
                              mutability:
                                type: string
                                enum:
                                  - readOnly
                                  - readWrite
                                  - immutable
                                  - writeOnly
                              returned:
                                type: string
                                enum:
                                  - always
                                  - never
                                  - default
                                  - request
                              uniqueness:
                                type: string
                                enum:
                                  - none
                                  - server
                                  - global
                              canonicalValues:
                                type: array
                                items:
                                  type: string
                              referenceTypes:
                                type: array
                                items:
                                  type: string
                              subAttributes:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    name:
                                      type: string
                                      minLength: 1
                                      maxLength: 255
                                    type:
                                      type: string
                                      enum:
                                        - string
                                        - boolean
                                        - decimal
                                        - integer
                                        - dateTime
                                        - reference
                                        - complex
                                    multiValued:
                                      type: boolean
                                    description:
                                      type: string
                                      maxLength: 1000
                                    required:
                                      type: boolean
                                    caseExact:
                                      type: boolean
                                    mutability:
                                      type: string
                                      enum:
                                        - readOnly
                                        - readWrite
                                        - immutable
                                        - writeOnly
                                    returned:
                                      type: string
                                      enum:
                                        - always
                                        - never
                                        - default
                                        - request
                                    uniqueness:
                                      type: string
                                      enum:
                                        - none
                                        - server
                                        - global
                                    canonicalValues:
                                      type: array
                                      items:
                                        type: string
                                    referenceTypes:
                                      type: array
                                      items:
                                        type: string
                                  required:
                                    - name
                                    - type
                                    - multiValued
                                    - description
                                    - required
                                    - caseExact
                                    - mutability
                                    - returned
                                    - uniqueness
                                  additionalProperties: false
                                maxItems: 100
                            required:
                              - name
                              - type
                              - multiValued
                              - description
                              - required
                              - caseExact
                              - mutability
                              - returned
                              - uniqueness
                            additionalProperties: false
                        meta:
                          type: object
                          properties:
                            resourceType:
                              type: string
                              enum:
                                - Schema
                            location:
                              type: string
                              format: uri
                          required:
                            - resourceType
                            - location
                          additionalProperties: false
                      required:
                        - schemas
                        - id
                        - name
                        - description
                        - attributes
                        - meta
                      additionalProperties: false
                required:
                  - schemas
                  - totalResults
                  - startIndex
                  - itemsPerPage
                  - Resources
                additionalProperties: false
        "401":
          description: SCIM protocol error
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
      security:
        - ScimBearer: []
