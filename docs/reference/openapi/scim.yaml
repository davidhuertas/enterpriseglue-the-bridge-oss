openapi: 3.0.3
info:
  title: EnterpriseGlue SCIM API
  version: 0.1.0
  description: |-
    SCIM 2.0 provisioning endpoints for external identity providers, authenticated with directory credentials.

    Tenant-scoped routes under `/api/t/{tenantSlug}/...` are also served at the legacy alias `/t/{tenantSlug}/api/...`; only the first form is documented.
servers:
  - url: /
    description: This EnterpriseGlue deployment
tags:
  - name: SCIM
    description: SCIM 2.0 provisioning endpoints for external identity providers, authenticated with directory credentials.
paths:
  /scim/v2/{directoryKey}/oauth/token:
    post:
      operationId: postScimV2ByDirectoryKeyOauthToken
      tags:
        - SCIM
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[a-z][a-z0-9._-]*$
          required: true
          name: directoryKey
          in: path
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum:
                    - client_credentials
                scope:
                  type: string
                  maxLength: 512
                client_id:
                  type: string
                  minLength: 8
                  maxLength: 255
                client_secret:
                  type: string
                  minLength: 32
                  maxLength: 4096
              required:
                - grant_type
              additionalProperties: false
      responses:
        "200":
          description: Short-lived directory-scoped SCIM access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    minLength: 32
                    maxLength: 8192
                  token_type:
                    type: string
                    enum:
                      - Bearer
                  expires_in:
                    type: integer
                    minimum: 60
                    maximum: 3600
                  scope:
                    type: string
                    enum:
                      - scim
                required:
                  - access_token
                  - token_type
                  - expires_in
                  - scope
                additionalProperties: false
        "400":
          description: Invalid OAuth request or scope
        "401":
          description: Invalid or revoked client credential
      security:
        - ScimOAuthClient: []
  /scim/v2/{directoryKey}/ServiceProviderConfig:
    get:
      operationId: getScimV2ByDirectoryKeyServiceProviderConfig
      tags:
        - SCIM
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[a-z][a-z0-9._-]*$
          required: true
          name: directoryKey
          in: path
      responses:
        "200":
          description: SCIM service-provider capabilities
          content:
            application/scim+json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                      enum:
                        - urn:ietf:params:scim:schemas:core:2.0:ServiceProviderConfig
                    minItems: 1
                    maxItems: 1
                  documentationUri:
                    type: string
                    format: uri
                  patch:
                    type: object
                    properties:
                      supported:
                        type: boolean
                    required:
                      - supported
                    additionalProperties: false
                  bulk:
                    type: object
                    properties:
                      supported:
                        type: boolean
                      maxOperations:
                        type: integer
                        minimum: 0
                      maxPayloadSize:
                        type: integer
                        minimum: 0
                    required:
                      - supported
                      - maxOperations
                      - maxPayloadSize
                    additionalProperties: false
                  filter:
                    type: object
                    properties:
                      supported:
                        type: boolean
                      maxResults:
                        type: integer
                        minimum: 0
                        exclusiveMinimum: true
                    required:
                      - supported
                      - maxResults
                    additionalProperties: false
                  changePassword:
                    type: object
                    properties:
                      supported:
                        type: boolean
                    required:
                      - supported
                    additionalProperties: false
                  sort:
                    type: object
                    properties:
                      supported:
                        type: boolean
                    required:
                      - supported
                    additionalProperties: false
                  etag:
                    type: object
                    properties:
                      supported:
                        type: boolean
                    required:
                      - supported
                    additionalProperties: false
                  authenticationSchemes:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                            - oauth2
                            - oauthbearertoken
                        name:
                          type: string
                          minLength: 1
                          maxLength: 128
                        description:
                          type: string
                          minLength: 1
                          maxLength: 1000
                        specUri:
                          type: string
                          format: uri
                        primary:
                          type: boolean
                      required:
                        - type
                        - name
                        - description
                        - specUri
                        - primary
                      additionalProperties: false
                    minItems: 1
                  meta:
                    type: object
                    properties:
                      resourceType:
                        type: string
                        enum:
                          - ServiceProviderConfig
                      location:
                        type: string
                        format: uri
                    required:
                      - resourceType
                      - location
                    additionalProperties: false
                required:
                  - schemas
                  - documentationUri
                  - patch
                  - bulk
                  - filter
                  - changePassword
                  - sort
                  - etag
                  - authenticationSchemes
                  - meta
                additionalProperties: false
        "401":
          description: SCIM protocol error
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
      security:
        - ScimBearer: []
  /scim/v2/{directoryKey}/Bulk:
    post:
      operationId: postScimV2ByDirectoryKeyBulk
      tags:
        - SCIM
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[a-z][a-z0-9._-]*$
          required: true
          name: directoryKey
          in: path
      requestBody:
        content:
          application/scim+json:
            schema:
              type: object
              properties:
                schemas:
                  type: array
                  items:
                    type: string
                    enum:
                      - urn:ietf:params:scim:api:messages:2.0:BulkRequest
                  minItems: 1
                  maxItems: 1
                failOnErrors:
                  type: integer
                  minimum: 0
                  maximum: 50
                Operations:
                  type: array
                  items:
                    type: object
                    properties:
                      method:
                        type: string
                        enum:
                          - POST
                          - PUT
                          - PATCH
                          - DELETE
                      bulkId:
                        type: string
                        minLength: 1
                        maxLength: 255
                      version:
                        type: string
                        pattern: ^W\/"[A-Za-z0-9._:-]+"$
                      path:
                        type: string
                        minLength: 1
                        maxLength: 1000
                        pattern: ^\/(?:Users|Groups)(?:\/[^/?#]+)?$
                      data:
                        nullable: true
                    required:
                      - method
                      - path
                    additionalProperties: false
                  minItems: 1
                  maxItems: 50
              required:
                - schemas
                - Operations
              additionalProperties: false
      responses:
        "200":
          description: Bounded SCIM Bulk operation results
          content:
            application/scim+json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                      enum:
                        - urn:ietf:params:scim:api:messages:2.0:BulkResponse
                    minItems: 1
                    maxItems: 1
                  Operations:
                    type: array
                    items:
                      type: object
                      properties:
                        method:
                          type: string
                          enum:
                            - POST
                            - PUT
                            - PATCH
                            - DELETE
                        bulkId:
                          type: string
                          minLength: 1
                          maxLength: 255
                        location:
                          type: string
                          format: uri
                        version:
                          type: string
                          pattern: ^W\/"[A-Za-z0-9._:-]+"$
                        status:
                          type: string
                          pattern: ^[1-5][0-9]{2}$
                        response:
                          $ref: "#/components/schemas/ScimError"
                      required:
                        - method
                        - status
                      additionalProperties: false
                    maxItems: 50
                required:
                  - schemas
                  - Operations
                additionalProperties: false
        "400":
          description: SCIM protocol error
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401":
          description: SCIM protocol error
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "413":
          description: SCIM protocol error
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
      security:
        - ScimBearer: []
  /scim/v2/{directoryKey}/Schemas:
