                            - engine_metadata
                            - engine_access
                            - diagnostics
                            - events
                            - plugin_storage
                            - secret_use
                            - notifications
                            - scheduler
                        scope:
                          type: string
                          enum:
                            - deployment
                            - tenant
                            - resource
                        dataClass:
                          type: string
                          enum:
                            - none
                            - safe_metadata
                            - sanitized_content
