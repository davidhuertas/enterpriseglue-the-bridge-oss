                            type: string
                            enum:
                              - current-and-previous-minor-when-available
                          hostMinorLines:
                            type: array
                            items:
                              type: string
                              minLength: 3
                              maxLength: 30
                              pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)$
                            minItems: 1
                            maxItems: 2
                          sdkMinorLines:
                            type: array
                            items:
                              type: string
                              minLength: 3
                              maxLength: 30
                              pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)$
                            minItems: 1
                            maxItems: 2
                          sdkVersions:
                            type: array
                            items:
                              type: string
                              maxLength: 100
                              pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$
