  /api/workloads/tenants/{tenantId}/apps/{pluginId}/eligibility:
    put:
      operationId: putWorkloadsTenantsByTenantIdAppsByPluginIdEligibility
      tags:
        - Platform & Tenancy
      summary: Apply a signed tenant application eligibility projection
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 160
          required: true
          name: tenantId
          in: path
        - schema:
            type: string
            minLength: 3
            maxLength: 200
          required: true
          name: pluginId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                signedProjection:
                  type: string
                  minLength: 32
                  maxLength: 16384
              required:
                - signedProjection
              additionalProperties: false
      responses:
        "200":
          description: Verified safe eligibility projection applied idempotently
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiVersion:
                    type: string
                    enum:
                      - tenant-eligibility-projection.plugin.enterpriseglue.io/v1
                  pluginId:
                    type: string
                    minLength: 3
                    maxLength: 200
                    pattern: ^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)+$
                  pluginVersion:
                    type: string
                    maxLength: 100
                    pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$
                  state:
                    type: string
                    enum:
                      - not_required
                      - unavailable
                      - trial
                      - active
                      - grace
                      - expired
                      - revoked
                  effectiveFrom:
                    type: string
                    nullable: true
                    format: date-time
                  effectiveUntil:
                    type: string
                    nullable: true
                    format: date-time
                  limitsHash:
                    type: string
                    pattern: ^[a-f0-9]{64}$
                  revision:
                    type: integer
                    minimum: 0
                  issuer:
                    type: string
                    minLength: 1
                    maxLength: 500
                  expiresAt:
                    type: string
                    format: date-time
                  projectionRef:
                    type: string
                    minLength: 1
                    maxLength: 256
                    pattern: ^[A-Za-z0-9._:-]+$
                required:
                  - apiVersion
                  - pluginId
                  - pluginVersion
                  - state
                  - effectiveFrom
                  - effectiveUntil
                  - limitsHash
                  - revision
                  - issuer
                  - expiresAt
                  - projectionRef
                additionalProperties: false
        "400":
          description: Projection or signature is invalid
        "409":
          description: Projection scope, revision, or eligibility state conflicts
        "503":
          description: Eligibility verification is not configured
      security:
        - BearerAuth: []
        - CookieAuth: []
