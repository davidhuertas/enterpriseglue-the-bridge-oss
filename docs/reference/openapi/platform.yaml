components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token returned by the login endpoints, sent as `Authorization: Bearer <token>`."
    CookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: Access token cookie set by the browser login flows. Mutating requests also need the XSRF header.
  schemas:
    AccessAuthorityMode:
      type: string
      enum:
        - manual
        - transition_to_sso
        - sso_managed
      description: Controls manual membership and scoped role-assignment mutations. SSO-managed mode preserves existing rows as effective, view-only access.
    AccessGovernanceOwnershipMode:
      type: string
      enum:
        - manual
        - config_locked
        - config_warn
      description: Declares whether the five governance settings are portal-owned, configuration-locked, or editable with drift tracking.
    DashboardContext:
      type: object
      properties:
        isPlatformAdmin:
          type: boolean
        ownedEngineIds:
          type: array
          items:
            type: string
        delegatedEngineIds:
          type: array
          items:
            type: string
        accessibleEngineIds:
          type: array
          items:
            type: string
        runtimeScopedEngineIds:
          type: array
          items:
            type: string
        projectMemberships:
          type: array
          items:
            type: object
            properties:
              projectId:
                type: string
              projectName:
                type: string
              role:
                type: string
            required:
              - projectId
              - projectName
              - role
        canViewActiveUsers:
          type: boolean
        canViewAllProjects:
          type: boolean
        canViewEngines:
          type: boolean
        canViewProcessData:
          type: boolean
        canViewDeployments:
          type: boolean
        canViewMetrics:
          type: boolean
      required:
        - isPlatformAdmin
        - ownedEngineIds
        - delegatedEngineIds
        - accessibleEngineIds
        - runtimeScopedEngineIds
        - projectMemberships
        - canViewActiveUsers
        - canViewAllProjects
        - canViewEngines
        - canViewProcessData
        - canViewDeployments
        - canViewMetrics
    DashboardStats:
      type: object
      properties:
        totalProjects:
          type: integer
          minimum: 0
        totalFiles:
          type: integer
          minimum: 0
        fileTypes:
          type: object
          properties:
            bpmn:
              type: integer
              minimum: 0
            dmn:
              type: integer
              minimum: 0
            form:
              type: integer
              minimum: 0
          required:
            - bpmn
            - dmn
            - form
      required:
        - totalProjects
        - totalFiles
        - fileTypes
    EngineOnboardingMode:
      type: string
      enum:
        - manual_allowed
        - external_only
        - hybrid
      description: Controls manual engine inventory lifecycle operations. Configuration bundles and the external registration API retain their own source-owned paths.
    EngineRuntimeAuthorizationMode:
      type: string
      enum:
        - enterpriseglue_authoritative
        - mirrored_engine_backstop
      description: Controls runtime authorization authority independently from authentication, engine onboarding, and membership management.
    EnvironmentTag:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
          nullable: true
        manualDeployAllowed:
          type: boolean
        sortOrder:
          type: number
        isDefault:
          type: boolean
        configKey:
          type: string
          nullable: true
        sourceRef:
          type: string
          nullable: true
        ownershipMode:
          type: string
          enum:
            - manual
            - config_locked
            - config_warn
        sourceHash:
          type: string
          nullable: true
        lastAppliedAt:
          type: number
          nullable: true
        driftStatus:
          type: string
          nullable: true
          enum:
            - in_sync
            - drifted
            - null
        configGeneration:
          type: integer
          minimum: 0
        createdAt:
          type: number
        updatedAt:
          type: number
      required:
        - id
        - name
        - color
        - manualDeployAllowed
        - sortOrder
        - isDefault
        - createdAt
        - updatedAt
    ManagedEngineWorkloadDecommissionRequest:
      type: object
      properties:
        operationId:
          type: string
          minLength: 16
          maxLength: 200
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        engineRef:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
      required:
        - operationId
        - engineRef
      additionalProperties: false
    ManagedEngineWorkloadRegistrationRequest:
      type: object
      properties:
        operationId:
          type: string
          minLength: 16
          maxLength: 200
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        engineRef:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        displayName:
          type: string
          minLength: 1
          maxLength: 255
        baseUrl:
          type: string
          minLength: 1
          maxLength: 2048
          format: uri
        credentials:
          type: object
          properties:
            type:
              type: string
              enum:
                - basic
            username:
              type: string
              minLength: 1
              maxLength: 255
            password:
              type: string
              minLength: 1
              maxLength: 4096
          required:
            - type
            - username
            - password
          additionalProperties: false
      required:
        - operationId
        - engineRef
        - displayName
        - baseUrl
        - credentials
      additionalProperties: false
    NativeTenant:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
        status:
          type: string
          enum:
            - active
            - suspended
            - deleting
        placementKey:
          type: string
          nullable: true
        placementEpoch:
          type: integer
          minimum: 0
          exclusiveMinimum: true
        createdByUserId:
          type: string
          nullable: true
        createdAt:
          type: integer
          nullable: true
          minimum: 0
        updatedAt:
          type: integer
          nullable: true
          minimum: 0
      required:
        - id
        - name
        - slug
        - status
        - placementKey
        - placementEpoch
        - createdByUserId
        - createdAt
        - updatedAt
    PlatformBranding:
      type: object
      properties:
        logoUrl:
          type: string
          nullable: true
        loginLogoUrl:
          type: string
          nullable: true
        loginTitleVerticalOffset:
          type: number
        loginTitleColor:
          type: string
          nullable: true
        logoTitle:
          type: string
          nullable: true
        logoScale:
          type: number
        titleFontUrl:
          type: string
          nullable: true
        titleFontWeight:
          type: string
        titleFontSize:
          type: number
        titleVerticalOffset:
          type: number
        menuAccentColor:
          type: string
          nullable: true
        faviconUrl:
          type: string
          nullable: true
        ownership:
          type: object
          nullable: true
          properties:
            section:
              type: string
              enum:
                - governance
                - login
                - general
                - git_sync
                - deployment
                - invitations
                - pii
                - branding
            scopeKey:
              type: string
            sourceRef:
              type: string
              nullable: true
            ownershipMode:
              $ref: "#/components/schemas/AccessGovernanceOwnershipMode"
            sourceHash:
              type: string
              nullable: true
            lastAppliedAt:
              type: number
              nullable: true
            driftStatus:
              type: string
              nullable: true
              enum:
                - in_sync
                - drifted
                - null
            generation:
              type: integer
              minimum: 0
          required:
            - section
            - scopeKey
            - sourceRef
            - ownershipMode
            - sourceHash
            - lastAppliedAt
            - driftStatus
            - generation
          additionalProperties: false
      required:
        - logoUrl
        - loginLogoUrl
        - loginTitleVerticalOffset
        - loginTitleColor
        - logoTitle
        - logoScale
        - titleFontUrl
        - titleFontWeight
        - titleFontSize
        - titleVerticalOffset
        - menuAccentColor
        - faviconUrl
    PlatformCloudIdentityRequest:
      type: object
      properties:
        action:
          type: string
          enum:
            - platform.tenants.self_create
            - platform.tenants.read
            - platform.tenants.manage
          description: Exact platform tenant action authorized before this identity is issued
      required:
        - action
      additionalProperties: false
    PlatformCloudIdentityResponse:
      type: object
      properties:
        token:
          type: string
          minLength: 32
        expiresIn:
          type: number
          enum:
            - 90
        action:
          type: string
          enum:
            - platform.tenants.self_create
            - platform.tenants.read
            - platform.tenants.manage
          description: Exact platform tenant action authorized before this identity is issued
      required:
        - token
        - expiresIn
        - action
      additionalProperties: false
    PlatformGovernanceBehavior:
      type: object
      properties:
        manualEngineAccessMutationsAllowed:
          type: boolean
        manualProjectAccessMutationsAllowed:
          type: boolean
        manualEngineRegistrationAllowed:
          type: boolean
        manualProjectEngineTargetMutationsAllowed:
          type: boolean
        governanceSettingsMutations:
          type: string
          enum:
            - allowed
            - allowed_marks_drift
            - blocked
      required:
        - manualEngineAccessMutationsAllowed
        - manualProjectAccessMutationsAllowed
        - manualEngineRegistrationAllowed
        - manualProjectEngineTargetMutationsAllowed
        - governanceSettingsMutations
      additionalProperties: false
    PlatformSettings:
      type: object
      properties:
        defaultEnvironmentTagId:
          type: string
          nullable: true
        syncPushEnabled:
          type: boolean
        syncPullEnabled:
          type: boolean
        syncBothEnabled:
          type: boolean
        gitProjectTokenSharingEnabled:
          type: boolean
