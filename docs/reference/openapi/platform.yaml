openapi: 3.0.3
info:
  title: EnterpriseGlue Platform & Tenancy API
  version: 0.1.0
  description: |-
    Platform administration, settings, email, branding, audit, tenants, workloads, releases, plugins and tenant applications.

    Tenant-scoped routes under `/api/t/{tenantSlug}/...` are also served at the legacy alias `/t/{tenantSlug}/api/...`; only the first form is documented.
servers:
  - url: /
    description: This EnterpriseGlue deployment
tags:
  - name: Platform & Tenancy
    description: Platform administration, settings, email, branding, audit, tenants, workloads, releases, plugins and tenant applications.
paths:
  /api/admin/environments:
    get:
      operationId: getAdminEnvironments
      tags:
        - Platform & Tenancy
      responses:
        "200":
          description: List environment tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnvironmentTag"
      security:
        - BearerAuth: []
        - CookieAuth: []
    post:
      operationId: postAdminEnvironments
      tags:
        - Platform & Tenancy
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 50
                color:
                  type: string
                  pattern: ^#[0-9a-fA-F]{6}$
                manualDeployAllowed:
                  type: boolean
              required:
                - name
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentTag"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/admin/environments/{id}:
    put:
      operationId: putAdminEnvironmentsById
      tags:
        - Platform & Tenancy
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 50
                color:
                  type: string
                  pattern: ^#[0-9a-fA-F]{6}$
                manualDeployAllowed:
                  type: boolean
                isDefault:
                  type: boolean
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                required:
                  - success
      security:
        - BearerAuth: []
        - CookieAuth: []
    delete:
      operationId: deleteAdminEnvironmentsById
      tags:
        - Platform & Tenancy
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "204":
          description: Deleted
        "400":
          description: In use
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/admin/environments/reorder:
    post:
      operationId: postAdminEnvironmentsReorder
      tags:
        - Platform & Tenancy
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                orderedIds:
                  type: array
                  items:
                    type: string
              required:
                - orderedIds
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                required:
                  - success
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/admin/branding:
    get:
      operationId: getAdminBranding
      tags:
        - Platform & Tenancy
      responses:
        "200":
          description: Platform branding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformBranding"
      security:
        - BearerAuth: []
        - CookieAuth: []
    put:
      operationId: putAdminBranding
      tags:
        - Platform & Tenancy
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                logoUrl:
                  type: string
                  nullable: true
                loginLogoUrl:
                  type: string
                  nullable: true
                loginTitleVerticalOffset:
                  type: number
                  minimum: -50
                  maximum: 50
                loginTitleColor:
                  type: string
                  nullable: true
                  pattern: ^#[0-9A-Fa-f]{6}$
                logoTitle:
                  type: string
                  nullable: true
                logoScale:
                  type: number
                  minimum: 50
                  maximum: 200
                titleFontUrl:
                  type: string
                  nullable: true
                titleFontWeight:
                  type: string
                titleFontSize:
                  type: number
                  minimum: 10
                  maximum: 32
                titleVerticalOffset:
                  type: number
                  minimum: -20
                  maximum: 20
                menuAccentColor:
                  type: string
                  nullable: true
                  pattern: ^#[0-9A-Fa-f]{6}$
                faviconUrl:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Branding updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                required:
                  - success
      security:
        - BearerAuth: []
        - CookieAuth: []
    delete:
      operationId: deleteAdminBranding
      tags:
        - Platform & Tenancy
      responses:
        "200":
          description: Branding reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                required:
                  - success
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/admin/settings:
    get:
      operationId: getAdminSettings
      tags:
        - Platform & Tenancy
      summary: Read platform settings and effective governance behavior
      description: Returns the five independent governance axes, configuration ownership/provenance, and derived read-only behavior that API clients should use when enabling or disabling manual controls.
      responses:
        "200":
          description: Platform settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"
      security:
        - BearerAuth: []
        - CookieAuth: []
    put:
      operationId: putAdminSettings
      tags:
        - Platform & Tenancy
      summary: Update portal-owned platform settings
      description: Updates only supplied fields. The five governance fields are rejected when their settings block is configuration-locked. This endpoint does not register engines, create projects, configure SSO providers, or change individual memberships.
      requestBody:
        description: Partial update. Use the configuration-bundle API when governance settings are managed headlessly.
        content:
          application/json:
            schema:
              type: object
              properties:
                defaultEnvironmentTagId:
                  type: string
                  nullable: true
                syncPushEnabled:
                  type: boolean
                syncPullEnabled:
                  type: boolean
                syncBothEnabled:
                  type: boolean
                gitProjectTokenSharingEnabled:
                  type: boolean
                defaultDeployRoles:
                  type: array
                  items:
                    type: string
                engineOnboardingMode:
                  $ref: "#/components/schemas/EngineOnboardingMode"
                projectEngineTargetMode:
                  $ref: "#/components/schemas/ProjectEngineTargetPolicyMode"
                engineAccessAuthority:
                  $ref: "#/components/schemas/AccessAuthorityMode"
                projectAccessAuthority:
                  $ref: "#/components/schemas/AccessAuthorityMode"
                engineRuntimeAuthorizationMode:
                  $ref: "#/components/schemas/EngineRuntimeAuthorizationMode"
                credentiallessCustomerSidecarsEnabled:
                  type: boolean
                inviteAllowAllDomains:
                  type: boolean
                inviteAllowedDomains:
                  type: array
                  items:
                    type: string
                localPasswordLoginMode:
                  type: string
                  enum:
                    - auto
                    - enabled
                    - disabled
                  description: Controls ordinary local password login. auto preserves safe SSO enforcement by disabling ordinary local login whenever a direct identity provider is enabled.
                ssoProviderSelectionMode:
                  type: string
                  enum:
                    - auto_redirect_single
                    - chooser
                    - progressive
                  description: Controls how the public login page selects among enabled direct identity providers.
                ssoAllEnginesAssignmentMappingsEnabled:
                  type: boolean
                ssoEngineOwnerAssignmentMappingsEnabled:
                  type: boolean
                ssoEngineDelegateAssignmentMappingsEnabled:
                  type: boolean
                ssoRegexClaimMappingsEnabled:
                  type: boolean
                ssoBroadEntitlementMappingsEnabled:
                  type: boolean
                ssoSecretViewMappingsEnabled:
                  type: boolean
                ssoUnredactedAuditMappingsEnabled:
                  type: boolean
                ssoPermanentDeleteMappingsEnabled:
                  type: boolean
                piiRegexEnabled:
                  type: boolean
                piiExternalProviderEnabled:
                  type: boolean
                piiExternalProviderType:
                  type: string
                  nullable: true
                  enum:
                    - presidio
                    - gcp_dlp
                    - aws_comprehend
                    - azure_pii
                    - null
                piiExternalProviderEndpoint:
                  type: string
                  nullable: true
                  maxLength: 2048
                  format: uri
                piiExternalProviderAuthHeader:
                  type: string
                  nullable: true
                piiExternalProviderAuthToken:
                  type: string
                  nullable: true
                piiExternalProviderProjectId:
                  type: string
                  nullable: true
                piiExternalProviderRegion:
                  type: string
                  nullable: true
                piiRedactionStyle:
                  type: string
                piiScopes:
                  type: array
                  items:
                    type: string
                    enum:
                      - processDetails
                      - history
                      - logs
                      - errors
                      - audit
                piiMaxPayloadSizeBytes:
                  type: number
                emailPlatformName:
                  type: string
                  minLength: 1
                  maxLength: 160
              additionalProperties: false
            example:
              engineAccessAuthority: sso_managed
              projectAccessAuthority: manual
              engineOnboardingMode: external_only
              projectEngineTargetMode: hybrid
              engineRuntimeAuthorizationMode: enterpriseglue_authoritative
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                required:
                  - success
        "400":
          description: Unsupported runtime authorization mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnsupportedEngineRuntimeAuthorizationModeError"
        "403":
          description: Governance settings are configuration-locked or the caller lacks permission
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/plugin-platform/v1/catalog:
    get:
      operationId: getPluginPlatformV1Catalog
      tags:
        - Platform & Tenancy
      summary: Read the safe configured plugin discovery catalog
      responses:
        "200":
          description: Discovery-only catalog without artifact or deployment credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiVersion:
                    type: string
                    enum:
                      - catalog-projection.plugin.enterpriseglue.io/v1
                  catalog:
                    type: object
                    nullable: true
                    properties:
                      apiVersion:
                        type: string
                        enum:
                          - catalog.plugin.enterpriseglue.io/v2
                      kind:
                        type: string
                        enum:
                          - EnterpriseGluePluginCatalog
                      metadata:
                        type: object
                        properties:
                          revision:
                            type: string
                            maxLength: 100
                            pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$
                          generatedAt:
                            type: string
                            format: date-time
                          expiresAt:
                            type: string
                            format: date-time
                        required:
                          - revision
                          - generatedAt
                          - expiresAt
                        additionalProperties: false
                      products:
                        type: array
                        items:
                          type: object
                          properties:
                            descriptor:
                              type: object
                              properties:
                                apiVersion:
                                  type: string
                                  enum:
                                    - product.plugin.enterpriseglue.io/v1
                                kind:
                                  type: string
                                  enum:
                                    - EnterpriseGluePluginProduct
                                productId:
                                  type: string
                                  minLength: 3
                                  maxLength: 200
                                  pattern: ^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)+$
                                pluginId:
                                  type: string
                                  minLength: 3
                                  maxLength: 200
                                  pattern: ^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)+$
                                publisher:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                      minLength: 3
                                      maxLength: 200
                                      pattern: ^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)+$
                                    displayName:
                                      type: string
                                      minLength: 1
                                      maxLength: 100
                                    verification:
                                      type: string
                                      enum:
                                        - first_party
                                        - verified
                                        - unverified
                                  required:
                                    - id
                                    - displayName
                                    - verification
                                  additionalProperties: false
                                displayName:
                                  type: string
                                  minLength: 1
                                  maxLength: 100
                                summary:
                                  type: string
                                  minLength: 1
                                  maxLength: 500
                                categories:
                                  type: array
                                  items:
                                    type: string
                                    minLength: 3
                                    maxLength: 250
                                    pattern: ^[a-z0-9](?:[a-z0-9._-]*[a-z0-9])?$
                                  maxItems: 20
                                documentationUrl:
                                  type: string
                                  maxLength: 2000
                                  format: uri
                                supportUrl:
                                  type: string
                                  maxLength: 2000
                                  format: uri
                                securityUrl:
                                  type: string
                                  maxLength: 2000
                                  format: uri
                                privacyUrl:
                                  type: string
                                  maxLength: 2000
                                  format: uri
                                dataFlowUrl:
                                  type: string
                                  maxLength: 2000
                                  format: uri
                                retentionUrl:
                                  type: string
                                  maxLength: 2000
                                  format: uri
                                subprocessorsUrl:
                                  type: string
                                  maxLength: 2000
                                  format: uri
                                deploymentModes:
                                  type: array
                                  items:
                                    type: string
                                    enum:
                                      - compose_planner
                                      - compose_managed
                                      - kubernetes
                                      - openshift
                                  minItems: 1
                                  maxItems: 4
                                architectures:
                                  type: array
                                  items:
                                    type: string
                                    enum:
                                      - amd64
                                      - arm64
                                  minItems: 1
                                  maxItems: 2
                                commercialAction:
                                  type: string
                                  enum:
                                    - contact
                                    - trial
                                    - purchase
                                    - entitled
                              required:
                                - apiVersion
                                - kind
                                - productId
                                - pluginId
                                - publisher
                                - displayName
                                - summary
                                - categories
                                - documentationUrl
                                - supportUrl
                                - securityUrl
                                - privacyUrl
                                - dataFlowUrl
                                - retentionUrl
                                - deploymentModes
                                - architectures
                                - commercialAction
                              additionalProperties: false
                            releases:
                              type: array
                              items:
                                type: object
                                properties:
                                  version:
                                    type: string
                                    maxLength: 100
                                    pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$
                                  channel:
                                    type: string
                                    enum:
                                      - stable
                                      - preview
                                      - withdrawn
                                  state:
                                    type: string
                                    enum:
                                      - available
                                      - deprecated
                                      - withdrawn
                                      - security_revoked
                                  release:
                                    type: string
                                    maxLength: 500
                                    pattern: ^[a-z0-9][a-z0-9._:/-]*@sha256:[a-f0-9]{64}$
                                required:
                                  - version
                                  - channel
                                  - state
                                  - release
                                additionalProperties: false
                              minItems: 1
                              maxItems: 100
                          required:
                            - descriptor
                            - releases
                          additionalProperties: false
                        maxItems: 1000
                    required:
                      - apiVersion
                      - kind
                      - metadata
                      - products
                    additionalProperties: false
                required:
                  - apiVersion
                  - catalog
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/plugin-platform/v1/manager:
    get:
      operationId: getPluginPlatformV1Manager
      tags:
        - Platform & Tenancy
      summary: Read customer-local Plugin Manager availability and capabilities
      responses:
        "200":
          description: Safe manager capability handshake
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiVersion:
                    type: string
                    enum:
                      - manager-status.plugin.enterpriseglue.io/v1
                  available:
                    type: boolean
                  capability:
                    type: object
                    nullable: true
                    properties:
                      apiVersion:
                        type: string
                        enum:
                          - manager-capability.plugin.enterpriseglue.io/v1
                      kind:
                        type: string
                        enum:
                          - EnterpriseGluePluginManagerCapability
                      managerId:
                        type: string
                        minLength: 1
                        maxLength: 256
                        pattern: ^[A-Za-z0-9._:-]+$
                      managerVersion:
                        type: string
                        maxLength: 100
                        pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$
                      protocolVersions:
                        type: array
                        items:
                          type: string
                          enum:
                            - v1
                      deploymentModes:
                        type: array
                        items:
                          type: string
                          enum:
                            - compose_planner
                            - compose_managed
                            - kubernetes
                            - openshift
                        minItems: 1
                        maxItems: 4
                      architectures:
                        type: array
                        items:
                          type: string
                          enum:
                            - amd64
                            - arm64
                        minItems: 1
                        maxItems: 2
                      operations:
                        type: array
                        items:
                          type: string
                          enum:
                            - plan
                            - install
                            - enable
                            - disable
                            - upgrade
                            - rollback
                            - uninstall
                            - offline_import
                            - host_upgrade_preflight
                        minItems: 1
                        maxItems: 9
                      state:
                        type: string
                        enum:
                          - unavailable
                          - planner_only
                          - ready
                          - busy
                          - recovery_required
                      observedAt:
                        type: string
                        format: date-time
                    required:
                      - apiVersion
                      - kind
                      - managerId
                      - managerVersion
                      - protocolVersions
                      - deploymentModes
                      - architectures
                      - operations
                      - state
                      - observedAt
                    additionalProperties: false
                required:
                  - apiVersion
                  - available
                  - capability
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/plugin-platform/v1/installations:
    get:
      operationId: getPluginPlatformV1Installations
      tags:
        - Platform & Tenancy
      summary: List paged plugin installation activity
      parameters:
        - schema:
            type: integer
            nullable: true
            minimum: 0
            maximum: 1000000
          required: false
          name: offset
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Safe intent, review, approval and observation summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PluginInstallationSummary"
                  total:
                    type: integer
                    minimum: 0
                required:
                  - items
                  - total
      security:
        - BearerAuth: []
        - CookieAuth: []
    post:
      operationId: postPluginPlatformV1Installations
      tags:
        - Platform & Tenancy
      summary: Create a revision-bound plugin installation intent
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pluginId:
                  type: string
                  minLength: 3
                  maxLength: 200
                  pattern: ^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)+$
                release:
                  type: string
                  maxLength: 500
                  pattern: ^[a-z0-9][a-z0-9._:/-]*@sha256:[a-f0-9]{64}$
                operation:
                  type: string
                  enum:
                    - install
                    - upgrade
                  default: install
                fromVersion:
                  type: string
                  maxLength: 100
                  pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$
                currentEnabled:
                  type: boolean
                source:
                  type: string
                  enum:
                    - connected_registry
                    - offline_delivery
                    - static_catalog
                deploymentMode:
                  type: string
                  enum:
                    - compose_planner
                    - compose_managed
                    - kubernetes
                    - openshift
                expectedPlatformRevision:
                  type: integer
                  minimum: 0
                idempotencyKey:
                  type: string
                  minLength: 1
                  maxLength: 256
                  pattern: ^[A-Za-z0-9._:-]+$
              required:
                - pluginId
                - release
                - source
                - deploymentMode
                - expectedPlatformRevision
                - idempotencyKey
              additionalProperties: false
      responses:
        "201":
          description: Installation intent accepted without deployment mutation
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiVersion:
                    type: string
                    enum:
                      - installation-intent.plugin.enterpriseglue.io/v1
                  kind:
                    type: string
                    enum:
                      - EnterpriseGluePluginInstallationIntent
                  installationId:
                    type: string
                    minLength: 1
                    maxLength: 256
                    pattern: ^[A-Za-z0-9._:-]+$
                  pluginId:
                    type: string
                    minLength: 3
                    maxLength: 200
                    pattern: ^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)+$
                  release:
                    type: string
                    maxLength: 500
                    pattern: ^[a-z0-9][a-z0-9._:/-]*@sha256:[a-f0-9]{64}$
                  operation:
                    type: string
                    enum:
                      - install
                      - upgrade
                    default: install
                  fromVersion:
                    type: string
                    maxLength: 100
                    pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$
                  currentEnabled:
                    type: boolean
                  source:
                    type: string
                    enum:
                      - connected_registry
                      - offline_delivery
                      - static_catalog
                  deploymentMode:
                    type: string
                    enum:
                      - compose_planner
                      - compose_managed
                      - kubernetes
                      - openshift
                  requesterRef:
                    type: string
                    minLength: 1
                    maxLength: 256
                    pattern: ^[A-Za-z0-9._:-]+$
                  expectedPlatformRevision:
                    type: integer
                    minimum: 0
                  idempotencyKey:
                    type: string
                    minLength: 1
                    maxLength: 256
                    pattern: ^[A-Za-z0-9._:-]+$
                  requestedAt:
                    type: string
                    format: date-time
                required:
                  - apiVersion
                  - kind
                  - installationId
                  - pluginId
                  - release
                  - source
                  - deploymentMode
                  - requesterRef
                  - expectedPlatformRevision
                  - idempotencyKey
                  - requestedAt
                additionalProperties: false
        "409":
          description: Platform revision or idempotency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginControlError"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/plugin-platform/v1/installations/{installationId}:
    get:
      operationId: getPluginPlatformV1InstallationsByInstallationId
      tags:
        - Platform & Tenancy
      summary: Read one plugin installation and its safe review
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 200
          required: true
          name: installationId
          in: path
      responses:
        "200":
          description: Safe installation summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginInstallationSummary"
        "404":
          description: Installation was not found
          content:
            application/json:
              schema:
