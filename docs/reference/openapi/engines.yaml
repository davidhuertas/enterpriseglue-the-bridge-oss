                                enum:
                                  - READ
                          required:
                            - sourceAssignmentReference
                            - disposition
                            - reasonCodes
                            - principalType
                            - nativeGroupReference
                            - resourceKind
                            - resourceReference
                            - camundaResourceType
                            - permissions
                          additionalProperties: false
                        maxItems: 50000
