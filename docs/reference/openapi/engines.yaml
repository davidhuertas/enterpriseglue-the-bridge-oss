      tags:
        - Engines
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Bounded newest-first sanitized Camunda native-grant migration receipts for one engine and tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                          maxLength: 255
                        engineId:
                          type: string
                          minLength: 1
                          maxLength: 255
                        tenantId:
                          type: string
                          nullable: true
                          minLength: 1
                          maxLength: 255
                        sourceKind:
                          type: string
                          enum:
                            - live_api
                            - customer_export
                        status:
                          type: string
                          enum:
                            - previewed
                            - draft_generated
                            - applied
                            - rolled_back
                            - failed
                        inputHash:
                          type: string
                          pattern: ^[a-f0-9]{64}$
                        mappingCatalogVersion:
                          type: string
                          minLength: 1
                          maxLength: 128
                        inventoryTruncated:
                          type: boolean
                        normalizedCounts:
                          $ref: "#/components/schemas/ActiveSourcesResponse"
                        classifications:
                          type: array
                          items:
                            type: object
                            properties:
                              sourceAuthorizationRef:
                                type: string
                                pattern: ^camunda-auth-[a-f0-9]{24}$
                              disposition:
                                type: string
                                enum:
                                  - proposed
                                  - approval_required
                                  - manual_required
                                  - blocked
                              reasonCodes:
                                type: array
                                items:
                                  type: string
                                  enum:
                                    - group_grant_process_definition
                                    - group_grant_decision_definition
                                    - broad_resource_acknowledgement_required
                                    - user_identity_mapping_required
                                    - global_authorization_not_convertible
                                    - revoke_authorization_not_convertible
                                    - missing_group_principal
                                    - unsupported_resource_type
                                    - permission_mapping_not_supported
                                    - missing_resource_id
                                    - runtime_resource_inventory_required
                                    - runtime_resource_not_found
                                    - runtime_resource_ambiguous
                                    - runtime_resource_unresolved_tenant
                                minItems: 1
                              principalType:
                                type: string
                                enum:
                                  - group
                                  - user
                                  - global
                              groupReference:
                                type: string
                                nullable: true
                                pattern: ^camunda-group-[a-f0-9]{24}$
                              resourceKind:
                                type: string
                                nullable: true
                                enum:
                                  - process_definition
                                  - decision_definition
                                  - null
                              resourceReference:
                                type: string
                                nullable: true
                                pattern: ^camunda-resource-[a-f0-9]{24}$
                              mappedActionIds:
                                type: array
                                items:
                                  type: string
                                  minLength: 1
                                  maxLength: 255
                            required:
                              - sourceAuthorizationRef
                              - disposition
                              - reasonCodes
                              - principalType
                              - groupReference
                              - resourceKind
                              - resourceReference
                              - mappedActionIds
                            additionalProperties: false
                        draftHash:
                          type: string
                          nullable: true
                          pattern: ^[a-f0-9]{64}$
                        appliedConfigBundleRunId:
                          type: string
                          nullable: true
                          minLength: 1
                          maxLength: 255
                        rollbackConfigBundleRunId:
                          type: string
                          nullable: true
                          minLength: 1
                          maxLength: 255
                        rolledBackAt:
                          type: integer
                          nullable: true
                        detailedSnapshotAvailable:
                          type: boolean
                        detailedSnapshotExpiresAt:
                          type: integer
                          nullable: true
                        createdAt:
                          type: integer
                        updatedAt:
                          type: integer
                      required:
                        - id
                        - engineId
                        - tenantId
                        - sourceKind
                        - status
                        - inputHash
                        - mappingCatalogVersion
                        - inventoryTruncated
                        - normalizedCounts
                        - classifications
                        - draftHash
                        - appliedConfigBundleRunId
                        - rollbackConfigBundleRunId
                        - rolledBackAt
                        - detailedSnapshotAvailable
                        - detailedSnapshotExpiresAt
                        - createdAt
                        - updatedAt
                      additionalProperties: false
                    maxItems: 100
                required:
                  - runs
                additionalProperties: false
      security:
        - BearerAuth: []
        - CookieAuth: []
