                        type: string
                        enum:
                          - previewed
                          - queued
                          - running
                          - succeeded
                          - failed
                          - rolled_back
                          - out_of_sync
                      sourceHash:
                        type: string
                        pattern: ^[a-f0-9]{64}$
                      desiredHash:
                        type: string
                        pattern: ^[a-f0-9]{64}$
                      resultHash:
                        type: string
                        nullable: true
                        pattern: ^[a-f0-9]{64}$
                      catalogVersion:
                        type: string
                        minLength: 1
                        maxLength: 128
                      capability:
                        type: object
                        additionalProperties:
                          type: boolean
                      counts:
                        $ref: "#/components/schemas/ActiveSourcesResponse"
                      classifications:
                        type: array
                        items:
                          type: object
                          properties:
                            sourceAssignmentReference:
                              type: string
                              pattern: ^backstop-assignment-[a-f0-9]{24}$
                            disposition:
                              type: string
                              enum:
                                - proposed
                                - manual_required
                                - blocked
                            reasonCodes:
                              type: array
                              items:
                                type: string
                                enum:
                                  - exact_group_read_projected
                                  - engine_type_not_supported
                                  - principal_not_group
                                  - group_mapping_missing
                                  - group_mapping_ambiguous
                                  - assignment_expired
                                  - permission_mapping_not_supported
                                  - scope_not_resource_specific
                                  - runtime_resource_inactive
                                  - runtime_resource_unresolved_tenant
                                  - runtime_resource_cross_tenant
                                  - native_authorization_key_cross_tenant
                                  - runtime_resource_kind_not_supported
                                  - runtime_resource_key_missing
                              minItems: 1
                            principalType:
                              type: string
                              enum:
                                - group
                                - user
                                - api_client
                                - service_account
                            nativeGroupReference:
                              type: string
                              nullable: true
                              pattern: ^(?:camunda-group|native-engine-group)-[a-f0-9]{24}$
                            resourceKind:
                              type: string
                              nullable: true
                              enum:
                                - process_definition
                                - decision_definition
