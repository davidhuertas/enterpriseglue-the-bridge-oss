                        type: integer
                        nullable: true
                      completedAt:
                        type: integer
                        nullable: true
                      createdAt:
                        type: integer
                      updatedAt:
                        type: integer
                    required:
                      - id
                      - engineId
                      - tenantId
                      - status
                      - sourceHash
                      - desiredHash
                      - resultHash
                      - catalogVersion
                      - capability
                      - counts
                      - classifications
                      - rollbackOfRunId
                      - observedOfRunId
                      - detailedSnapshotAvailable
                      - detailedSnapshotExpiresAt
                      - completedAt
