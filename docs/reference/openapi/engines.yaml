  /engines-api/engines/{id}/backstop/sync/{runId}/apply:
    post:
      operationId: postEnginesEnginesByIdBackstopSyncByRunIdApply
      tags:
        - Engines
      summary: Apply a reviewed mirrored-backstop preview
      description: |-
        Mirrored engine backstop operation for a compatible Camunda 7 or Operaton engine.

        For `connectionMode = customer_sidecar`, EnterpriseGlue calls the registered customer-owned sidecar. The sidecar may perform only the bounded tracked native-authorization operation required by this lifecycle step and owns its downstream engine authentication.

        A sidecar rejection or downstream failure fails closed. EnterpriseGlue never falls back to a direct-engine endpoint.
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
        - schema:
            type: string
          required: true
          name: runId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                desiredHash:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                acknowledgeDirectIdentityBoundary:
                  type: boolean
                  enum:
                    - true
              required:
                - desiredHash
                - acknowledgeDirectIdentityBoundary
              additionalProperties: false
      responses:
        "200":
          description: Applies an acknowledged mirrored-engine backstop preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    $ref: "#/components/schemas/EngineBackstopSyncRunSummary"
                  task:
                    type: object
                    nullable: true
                    properties:
                      taskId:
                        type: string
                        minLength: 1
                        maxLength: 255
                      runId:
                        type: string
                        minLength: 1
                        maxLength: 255
                      operation:
                        type: string
                        enum:
                          - apply
                          - rollback
                          - drift_check
                      status:
                        type: string
                        enum:
                          - queued
                          - running
                          - completed
                      attempts:
                        type: integer
                        minimum: 0
                      nextAttemptAt:
                        type: integer
                        nullable: true
                        minimum: 0
                      lastError:
                        type: string
                        nullable: true
                        maxLength: 2000
                    required:
                      - taskId
                      - runId
                      - operation
                      - status
                      - attempts
                      - nextAttemptAt
                      - lastError
                    additionalProperties: false
                required:
                  - run
                  - task
                additionalProperties: false
      security:
        - BearerAuth: []
        - CookieAuth: []
