  /engines-api/external/engines/{engineId}/deployment-receipts:
    post:
      operationId: postEnginesExternalEnginesByEngineIdDeploymentReceipts
      tags:
        - Engines
      parameters:
        - schema:
            type: string
          required: true
          name: engineId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotencyKey:
                  type: string
                  minLength: 8
                  maxLength: 255
                projectId:
                  type: string
                  minLength: 1
                  maxLength: 255
                engineDeploymentId:
                  type: string
                  minLength: 1
                  maxLength: 255
                artifacts:
                  type: array
                  items:
                    type: object
                    properties:
                      resourceKind:
                        type: string
                        enum:
                          - process_definition
                          - decision_definition
                      resourceKey:
                        type: string
                        minLength: 1
                        maxLength: 255
                      engineResourceId:
                        type: string
                        minLength: 1
                        maxLength: 255
                      runtimeTenantId:
                        type: string
                        minLength: 1
                        maxLength: 255
                      version:
                        type: integer
                        minimum: 0
                      fileId:
                        type: string
                        minLength: 1
                        maxLength: 255
                      labels:
                        type: object
                        additionalProperties:
                          type: string
                          minLength: 1
                          maxLength: 255
                    required:
                      - resourceKind
                      - resourceKey
                    additionalProperties: false
                  minItems: 1
                  maxItems: 500
                lineage:
                  type: object
                  properties:
                    pipelineRunId:
                      type: string
                      minLength: 1
                      maxLength: 255
                    commitSha:
                      type: string
                      minLength: 1
                      maxLength: 255
                    deploymentName:
                      type: string
                      minLength: 1
                      maxLength: 255
                  additionalProperties: false
              required:
                - idempotencyKey
                - projectId
                - engineDeploymentId
                - artifacts
              additionalProperties: false
      responses:
        "200":
          description: Existing idempotent deployment receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  receiptId:
                    type: string
                  idempotent:
                    type: boolean
                  inventory:
                    type: object
                    properties:
                      created:
                        type: integer
                      updated:
                        type: integer
                    required:
                      - created
                      - updated
                  materializedResourceSets:
                    type: integer
                required:
                  - receiptId
                  - idempotent
                  - inventory
                  - materializedResourceSets
        "201":
          description: Deployment receipt recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  receiptId:
                    type: string
                  idempotent:
                    type: boolean
                  inventory:
                    type: object
                    properties:
                      created:
                        type: integer
                      updated:
                        type: integer
                    required:
                      - created
                      - updated
                  materializedResourceSets:
                    type: integer
                required:
                  - receiptId
                  - idempotent
                  - inventory
                  - materializedResourceSets
        "401":
          description: API client bearer token required
        "403":
          description: API deployment is not allowed
      security:
        - BearerAuth: []
        - CookieAuth: []
