openapi: 3.0.3
info:
  title: EnterpriseGlue Engines API
  version: 0.1.0
  description: |-
    Engine registry, engine tenancy, external engines, project-engine targets, backstop and saved filters.

    Tenant-scoped routes under `/api/t/{tenantSlug}/...` are also served at the legacy alias `/t/{tenantSlug}/api/...`; only the first form is documented.
servers:
  - url: /
    description: This EnterpriseGlue deployment
tags:
  - name: Engines
    description: Engine registry, engine tenancy, external engines, project-engine targets, backstop and saved filters.
paths:
  /engines-api/engines:
    get:
      operationId: getEnginesEngines
      tags:
        - Engines
      parameters:
        - schema:
            type: string
            enum:
              - "true"
              - "false"
          required: false
          name: includeManageableShared
          in: query
      responses:
        "200":
          description: Authorization-filtered engine inventory
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    baseUrl:
                      type: string
                    type:
                      type: string
                      nullable: true
                      enum:
                        - ion
                        - operaton
                        - camunda7
                        - null
                    authType:
                      type: string
                      nullable: true
                      enum:
                        - none
                        - basic
                        - bearer
                        - oauth2-client-credentials
                        - null
                    username:
                      type: string
                      nullable: true
                    passwordEnc:
                      nullable: true
                    hasCredential:
                      type: boolean
                    oauthTokenUrl:
                      type: string
                      nullable: true
                    oauthScopes:
                      type: string
                      nullable: true
                    oauthAudience:
                      type: string
                      nullable: true
                    externalId:
                      type: string
                      nullable: true
                    labels:
                      type: object
                      additionalProperties:
                        type: string
                    registrationSource:
                      type: string
                      nullable: true
                    sourceRef:
                      type: string
                      nullable: true
                    configKey:
                      type: string
                      nullable: true
                    sourceHash:
                      type: string
                      nullable: true
                    lastAppliedAt:
                      type: number
                      nullable: true
                    ownershipMode:
                      type: string
                      nullable: true
                      enum:
                        - manual
                        - config_warn
                        - config_locked
                        - null
                    externalSystemId:
                      type: string
                      nullable: true
                    managementMode:
                      type: string
                      nullable: true
                    fieldOwnership:
                      type: object
                      additionalProperties:
                        type: string
                        enum:
                          - manual
                          - external
                    driftStatus:
                      type: string
                      nullable: true
                    lifecycleStatus:
                      type: string
                      nullable: true
                    lastExternalSyncAt:
                      type: number
                      nullable: true
                    reportedCapabilities:
                      type: object
                      nullable: true
                      properties:
                        operations:
                          type: array
                          items:
                            type: string
                        queryCapabilities:
                          type: object
                          properties:
                            processDefinitionKey:
                              type: boolean
                            decisionDefinitionKey:
                              type: boolean
                            tenantFilters:
                              type: boolean
                            instanceLineage:
                              type: boolean
                            history:
                              type: boolean
                            jobs:
                              type: boolean
                            incidents:
                              type: boolean
                            batches:
                              type: boolean
                            counts:
                              type: boolean
                          additionalProperties: false
                        supportLevel:
                          type: string
                          nullable: true
                        compatibilityProfile:
                          type: string
                          nullable: true
                      additionalProperties:
                        nullable: true
                    capabilityStatus:
                      type: string
                      nullable: true
                      enum:
                        - unknown
                        - in_sync
                        - mismatch
                        - null
                    capabilityDiagnostics:
                      type: object
                      properties:
                        status:
                          type: string
                          enum:
                            - unknown
                            - in_sync
                            - mismatch
                        expectedOperations:
                          type: array
                          items:
                            type: string
                        reportedOperations:
                          type: array
                          items:
                            type: string
                        missingOperations:
                          type: array
                          items:
                            type: string
                        extraOperations:
                          type: array
                          items:
                            type: string
                        expectedQueryCapabilities:
                          type: object
                          properties:
                            processDefinitionKey:
                              type: boolean
                            decisionDefinitionKey:
                              type: boolean
                            tenantFilters:
                              type: boolean
                            instanceLineage:
                              type: boolean
                            history:
                              type: boolean
                            jobs:
                              type: boolean
                            incidents:
                              type: boolean
                            batches:
                              type: boolean
                            counts:
                              type: boolean
                          additionalProperties: false
                        reportedQueryCapabilities:
                          type: object
                          nullable: true
                          properties:
                            processDefinitionKey:
                              type: boolean
                            decisionDefinitionKey:
                              type: boolean
                            tenantFilters:
                              type: boolean
                            instanceLineage:
                              type: boolean
                            history:
                              type: boolean
                            jobs:
                              type: boolean
                            incidents:
                              type: boolean
                            batches:
                              type: boolean
                            counts:
                              type: boolean
                          additionalProperties: false
                        mismatchedQueryCapabilities:
                          type: array
                          items:
                            type: string
                        expectedSupportLevel:
                          type: string
                        reportedSupportLevel:
                          type: string
                          nullable: true
                        expectedCompatibilityProfile:
                          type: string
                        reportedCompatibilityProfile:
                          type: string
                          nullable: true
                        issues:
                          type: array
                          items:
                            type: string
                        recommendation:
                          type: string
                      required:
                        - status
                        - expectedOperations
                        - reportedOperations
                        - missingOperations
                        - extraOperations
                        - expectedQueryCapabilities
                        - reportedQueryCapabilities
                        - mismatchedQueryCapabilities
                        - expectedSupportLevel
                        - reportedSupportLevel
                        - expectedCompatibilityProfile
                        - reportedCompatibilityProfile
                        - issues
                        - recommendation
                    capabilities:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                            - ion
                            - operaton
                            - camunda7
                        compatibilityProfile:
                          type: string
                          enum:
                            - camunda7-rest
                        supportLevel:
                          type: string
                          enum:
                            - certified
                            - compatible
                        operations:
                          type: array
                          items:
                            type: string
                        queryCapabilities:
                          type: object
                          properties:
                            processDefinitionKey:
                              type: boolean
                            decisionDefinitionKey:
                              type: boolean
                            tenantFilters:
                              type: boolean
                            instanceLineage:
                              type: boolean
                            history:
                              type: boolean
                            jobs:
                              type: boolean
                            incidents:
                              type: boolean
                            batches:
                              type: boolean
                            counts:
                              type: boolean
                          additionalProperties: false
                      required:
                        - type
                        - compatibilityProfile
                        - supportLevel
                        - operations
                        - queryCapabilities
                    runtimeAccessScope:
                      type: string
                      enum:
                        - engine_wide
                        - resource_aware
                    tenancyMode:
                      $ref: "#/components/schemas/EngineTenancyMode"
                    tenantMappingStrategy:
                      type: string
                      nullable: true
                      enum:
                        - engine_tenant_id
                        - deployment_target
                        - explicit
                        - null
                    tenantMappingVersion:
                      type: integer
                      minimum: 0
                    tenantResolutionStatus:
                      type: string
                      enum:
                        - ready
                        - incomplete
                        - conflict
                        - migration_required
                    lastTenantReconciledAt:
                      type: number
                      nullable: true
                    deploymentIntegration:
                      type: string
                      enum:
                        - enterpriseglue_proxy
                        - direct_engine
                    metadataDiscoveryEnabled:
                      type: boolean
                    deploymentDiscoveryEnabled:
                      type: boolean
                    reconciliationIntervalSeconds:
                      type: integer
                      minimum: 0
                      exclusiveMinimum: true
                    lastMetadataReconciledAt:
                      type: number
                      nullable: true
                    lastMetadataReconciliationStatus:
                      type: string
                      nullable: true
                      enum:
                        - succeeded
                        - failed
                        - null
                    pipelineReceiptEnabled:
                      type: boolean
                    connectionMode:
                      $ref: "#/components/schemas/EngineConnectionMode"
                    externalUpdatedAt:
                      type: number
                      nullable: true
                    active:
                      type: boolean
                      nullable: true
                    version:
                      type: string
                      nullable: true
                    ownerId:
                      type: string
                      nullable: true
                    delegateId:
                      type: string
                      nullable: true
                    governance:
                      type: object
                      properties:
                        accountableOwnerId:
                          type: string
                          nullable: true
                        delegateId:
                          type: string
                          nullable: true
                      required:
                        - accountableOwnerId
                        - delegateId
                    environmentTagId:
                      type: string
                      nullable: true
                    environmentLocked:
                      type: boolean
                      nullable: true
                    tenantId:
                      type: string
                      nullable: true
                    createdAt:
                      type: number
                    updatedAt:
                      type: number
                    myRole:
                      type: string
                      nullable: true
                      enum:
                        - owner
                        - delegate
                        - operator
                        - deployer
                        - null
                  required:
                    - id
                    - name
                  additionalProperties:
                    nullable: true
      security:
        - BearerAuth: []
        - CookieAuth: []
    post:
      operationId: postEnginesEngines
      tags:
        - Engines
      summary: Register an engine or customer sidecar
      description: |-
        Register an engine directly or through a customer-owned sidecar.

        When `connectionMode` is `customer_sidecar`, `baseUrl` is the sidecar endpoint and the configured authentication applies only to the EnterpriseGlue-to-sidecar hop.

        The sidecar owns the downstream engine credential or peer token. Do not send that material to EnterpriseGlue. Credentialless sidecars require the platform policy to allow them.

        See the Customer Sidecar Backstop Adapter API for the bounded native-authorization contract. This is the manual inventory channel and is disabled when engineOnboardingMode is external_only. It does not grant engine membership or change engineAccessAuthority.
      requestBody:
        description: Use customer_sidecar only when baseUrl addresses the customer-owned gateway, never the downstream engine.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEngineRequest"
            example:
              name: Payments customer sidecar
              baseUrl: https://payments-sidecar.example.invalid/engine-rest
              type: operaton
              connectionMode: customer_sidecar
              authType: basic
              username: enterpriseglue-sidecar
              passwordEnc: ref:env://PAYMENTS_SIDECAR_UPSTREAM_PASSWORD
              runtimeAccessScope: resource_aware
              tenancy:
                mode: dedicated
                tenantRef:
                  type: request_context
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Engine"
        "400":
          description: Endpoint or tenancy policy rejected the engine registration
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/EndpointAuthenticationPolicyError"
                  - $ref: "#/components/schemas/EngineTenancyErrorResponse"
        "403":
          description: Manual engine onboarding is disabled or the tenant reference is not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineTenancyErrorResponse"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /engines-api/external/engines:
    post:
      operationId: postEnginesExternalEngines
      tags:
        - Engines
      summary: Externally register an engine or customer sidecar
      description: |-
        Register an engine directly or through a customer-owned sidecar.

        When `connectionMode` is `customer_sidecar`, `baseUrl` is the sidecar endpoint and the configured authentication applies only to the EnterpriseGlue-to-sidecar hop.

        The sidecar owns the downstream engine credential or peer token. Do not send that material to EnterpriseGlue. Credentialless sidecars require the platform policy to allow them.

        See the Customer Sidecar Backstop Adapter API for the bounded native-authorization contract. This source-owned inventory channel remains independent from engineAccessAuthority and does not grant any user or group engine access.
      requestBody:
        description: External registries may register a customer sidecar, but may not supply its downstream engine credential or peer token.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalEngineRegistrationRequest"
      responses:
        "200":
          description: External engine updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalEngineRegistrationResponse"
        "201":
          description: External engine registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalEngineRegistrationResponse"
        "400":
          description: Endpoint or tenancy policy rejected the external registration
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/EndpointAuthenticationPolicyError"
                  - $ref: "#/components/schemas/EngineTenancyErrorResponse"
        "403":
          description: Tenant reference is not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineTenancyErrorResponse"
        "409":
          description: Topology transition is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineTenancyErrorResponse"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /engines-api/external/engines/{externalId}/tenant-mappings:
    put:
      operationId: putEnginesExternalEnginesByExternalIdTenantMappings
      tags:
        - Engines
      parameters:
        - schema:
            type: string
          required: true
          name: externalId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedMappingVersion:
                  type: integer
                  minimum: 0
                dryRun:
                  type: boolean
                  default: false
                atomic:
                  type: boolean
                  enum:
                    - true
                  default: true
                mappings:
                  type: array
                  items:
                    type: object
                    properties:
                      externalTenantId:
                        type: string
                        maxLength: 255
                        default: ""
                      tenantRef:
                        $ref: "#/components/schemas/EngineTenantReference"
                      strategy:
                        $ref: "#/components/schemas/EngineTenantMappingStrategy"
                      sourceRef:
                        type: string
                        minLength: 1
                        maxLength: 500
                      active:
                        type: boolean
                        default: true
                    required:
                      - tenantRef
                      - strategy
                      - sourceRef
                    additionalProperties: false
                  minItems: 1
                  maxItems: 500
                externalSystemId:
                  type: string
                  nullable: true
              required:
                - mappings
              additionalProperties: false
      responses:
        "200":
          description: External tenant mappings previewed or atomically applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalEngineTenantMappingsUpsertResponse"
        "400":
          description: Engine topology or mapping request is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineTenancyErrorResponse"
        "403":
          description: A tenant reference or external engine system is not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineTenancyErrorResponse"
        "409":
          description: Mapping version or ownership conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineTenancyErrorResponse"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /engines-api/external/engines/decommission:
    post:
      operationId: postEnginesExternalEnginesDecommission
      tags:
        - Engines
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                externalId:
                  type: string
                  minLength: 1
                  maxLength: 255
                externalSystemId:
                  type: string
                  nullable: true
                  minLength: 1
                reason:
                  type: string
                  nullable: true
                  maxLength: 2000
              required:
                - externalId
              additionalProperties: false
      responses:
        "200":
          description: External engine decommissioned
          content:
            application/json:
              schema:
                type: object
                properties:
                  decommissioned:
                    type: boolean
                  engineId:
                    type: string
                  externalId:
                    type: string
                  lifecycleStatus:
                    type: string
                    enum:
                      - decommissioned
                required:
                  - decommissioned
                  - engineId
                  - externalId
                  - lifecycleStatus
      security:
        - BearerAuth: []
        - CookieAuth: []
  /engines-api/external/project-engine-targets:
    post:
      operationId: postEnginesExternalProjectEngineTargets
      tags:
        - Engines
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                allowManualDeploy:
                  type: boolean
                allowCiDeploy:
                  type: boolean
                allowApiDeploy:
                  type: boolean
                allowImport:
                  type: boolean
                externalSystemId:
                  type: string
                projectId:
                  type: string
                engineId:
                  type: string
                externalEngineId:
                  type: string
                externalProjectId:
                  type: string
                externalTargetId:
                  type: string
                status:
                  type: string
                  enum:
                    - active
                    - disabled
                approvalStatus:
                  type: string
                  enum:
                    - not_required
                    - pending
                    - approved
                    - rejected
                policyTags:
                  type: array
                  items:
                    type: string
                diagnostics:
                  type: object
                  nullable: true
                  additionalProperties:
                    nullable: true
              required:
                - externalSystemId
                - projectId
      responses:
        "200":
          description: External project-engine target updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: boolean
                    enum:
                      - false
                  target:
                    $ref: "#/components/schemas/ExternalProjectEngineTarget"
                required:
                  - created
                  - target
                additionalProperties: false
        "201":
          description: External project-engine target registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: boolean
                    enum:
                      - true
                  target:
                    $ref: "#/components/schemas/ExternalProjectEngineTarget"
                required:
                  - created
                  - target
                additionalProperties: false
        "400":
          description: Invalid external project-engine target request
        "403":
          description: API client is not authorized to manage project-engine targets for this external system
        "409":
          description: Project-engine target is already managed by another source
      security:
        - BearerAuth: []
        - CookieAuth: []
  /engines-api/external/project-engine-targets/decommission:
    post:
      operationId: postEnginesExternalProjectEngineTargetsDecommission
      tags:
        - Engines
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                externalSystemId:
                  type: string
                projectId:
                  type: string
                engineId:
                  type: string
                externalEngineId:
                  type: string
                externalProjectId:
                  type: string
                externalTargetId:
                  type: string
              required:
                - externalSystemId
                - projectId
      responses:
        "200":
          description: External project-engine target archived or reported absent
          content:
            application/json:
              schema:
                type: object
                properties:
                  archived:
                    type: boolean
                  targetId:
                    type: string
                    nullable: true
                  reason:
                    type: string
                required:
                  - archived
                  - targetId
        "400":
          description: Invalid external project-engine target decommission request
        "403":
          description: API client is not authorized to manage project-engine targets for this external system
        "409":
          description: Project-engine target is managed by a different source
      security:
        - BearerAuth: []
        - CookieAuth: []
  /engines-api/engines/{id}:
    get:
      operationId: getEnginesEnginesById
      tags:
        - Engines
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Engine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Engine"
        "404":
          description: Not found
      security:
        - BearerAuth: []
        - CookieAuth: []
    put:
      operationId: putEnginesEnginesById
      tags:
        - Engines
      summary: Update an engine or customer sidecar
      description: |-
        Register an engine directly or through a customer-owned sidecar.

        When `connectionMode` is `customer_sidecar`, `baseUrl` is the sidecar endpoint and the configured authentication applies only to the EnterpriseGlue-to-sidecar hop.

        The sidecar owns the downstream engine credential or peer token. Do not send that material to EnterpriseGlue. Credentialless sidecars require the platform policy to allow them.

        See the Customer Sidecar Backstop Adapter API for the bounded native-authorization contract.
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      requestBody:
        description: Changing endpoint credentials changes only the EnterpriseGlue-to-sidecar hop for a customer_sidecar engine.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEngineRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Engine"
        "400":
          description: Endpoint or tenancy policy rejected the engine update
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/EndpointAuthenticationPolicyError"
                  - $ref: "#/components/schemas/EngineTenancyErrorResponse"
        "403":
          description: Tenant reference is not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineTenancyErrorResponse"
        "409":
          description: Topology transition is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineTenancyErrorResponse"
      security:
        - BearerAuth: []
        - CookieAuth: []
    delete:
      operationId: deleteEnginesEnginesById
      tags:
        - Engines
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "204":
          description: Deleted
      security:
        - BearerAuth: []
        - CookieAuth: []
  /engines-api/engines/tenancy/classification-report:
    get:
      operationId: getEnginesEnginesTenancyClassificationReport
      tags:
        - Engines
      responses:
        "200":
          description: Sanitized existing-engine tenancy classification and migration evidence report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineTenancyClassificationReport"
        "403":
          description: Platform engine administration permission is required
      security:
        - BearerAuth: []
        - CookieAuth: []
  /engines-api/engines/{id}/tenancy/diagnostics:
    get:
      operationId: getEnginesEnginesByIdTenancyDiagnostics
      tags:
        - Engines
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Sanitized engine tenancy diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineTenancyDiagnostics"
        "404":
          description: Engine not found
      security:
        - BearerAuth: []
        - CookieAuth: []
  /engines-api/engines/{id}/tenancy/preview:
    post:
      operationId: postEnginesEnginesByIdTenancyPreview
      tags:
        - Engines
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngineTenancyTransitionPreviewRequest"
      responses:
        "200":
          description: Topology transition impact preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineTenancyTransitionPreviewResponse"
        "400":
          description: The proposed topology is invalid or unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineTenancyErrorResponse"
        "403":
          description: The caller or source cannot change this topology
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineTenancyErrorResponse"
        "404":
          description: Engine not found
      security:
        - BearerAuth: []
        - CookieAuth: []
  /engines-api/engines/{id}/tenancy/apply:
    post:
      operationId: postEnginesEnginesByIdTenancyApply
      tags:
        - Engines
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngineTenancyTransitionApplyRequest"
      responses:
        "200":
          description: Topology transition applied atomically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineTenancyTransitionApplyResponse"
        "400":
          description: Required acknowledgement is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineTenancyErrorResponse"
        "403":
          description: The caller or source cannot change this topology
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineTenancyErrorResponse"
        "404":
          description: Engine not found
        "409":
          description: The transition preview is stale or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineTenancyErrorResponse"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /engines-api/engines/{id}/tenant-mappings:
    get:
      operationId: getEnginesEnginesByIdTenantMappings
      tags:
        - Engines
      parameters:
        - schema:
            type: string
