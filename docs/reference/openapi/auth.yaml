  /api/t/{tenantSlug}/auth/login-methods:
    get:
      operationId: getTByTenantSlugAuthLoginMethods
      tags:
        - Auth & Health
      parameters:
        - schema:
            type: string
          required: true
          name: tenantSlug
          in: path
      responses:
        "200":
          description: Tenant-scoped policy-resolved login methods safe to show before authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  localPassword:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                    required:
                      - enabled
                  providerSelection:
                    type: string
                    enum:
                      - auto_redirect_single
                      - chooser
                      - progressive
                    description: Controls how the public login page selects among enabled direct identity providers.
                  autoRedirectProviderId:
                    type: string
                    nullable: true
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        key:
                          type: string
                          minLength: 1
                          maxLength: 128
                        displayName:
                          type: string
                          minLength: 1
                          maxLength: 255
                        organization:
                          type: string
                          nullable: true
                        protocol:
                          type: string
                          enum:
                            - oidc
                            - saml
                            - ldap
                        loginMethod:
                          type: string
                          enum:
                            - redirect
                            - password
                        preferred:
                          type: boolean
                        loginDomains:
                          type: array
                          items:
                            type: string
                            maxLength: 253
                            pattern: ^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
                      required:
                        - id
                        - key
                        - displayName
                        - organization
                        - protocol
                        - loginMethod
                        - preferred
                        - loginDomains
                  configurationStatus:
                    type: string
                    enum:
                      - ready
                      - no_login_method
                required:
                  - localPassword
                  - providerSelection
                  - autoRedirectProviderId
                  - providers
                  - configurationStatus
      security: []
  /api/t/{tenantSlug}/auth/providers/{providerId}/start:
    get:
      operationId: getTByTenantSlugAuthProvidersByProviderIdStart
      tags:
        - Auth & Health
      parameters:
        - schema:
            type: string
          required: true
          name: tenantSlug
          in: path
        - schema:
            type: string
          required: true
          name: providerId
          in: path
      responses:
        "302":
          description: Redirect to the selected tenant-scoped OIDC or SAML identity provider
        "404":
          description: Identity provider not found in the resolved tenant scope
      security: []
  /api/t/{tenantSlug}/auth/providers/{providerId}/login:
    post:
      operationId: postTByTenantSlugAuthProvidersByProviderIdLogin
      tags:
        - Auth & Health
      parameters:
        - schema:
            type: string
          required: true
          name: tenantSlug
          in: path
        - schema:
            type: string
          required: true
          name: providerId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
                - username
                - password
      responses:
        "200":
          description: Tenant-scoped provider-neutral LDAP identity login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSessionLoginResponse"
        "401":
          description: Invalid directory credentials
      security: []
  /api/t/{tenantSlug}/auth/identity/callback:
    get:
      operationId: getTByTenantSlugAuthIdentityCallback
      tags:
        - Auth & Health
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
          required: true
          name: tenantSlug
          in: path
      responses:
        "302":
          description: Release-aware tenant-scoped OIDC callback redirect
        "401":
          description: Invalid, expired, or cross-tenant state
      security: []
  /api/t/{tenantSlug}/auth/providers/saml/callback:
    post:
      operationId: postTByTenantSlugAuthProvidersSamlCallback
      tags:
        - Auth & Health
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
          required: true
          name: tenantSlug
          in: path
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                SAMLResponse:
                  type: string
                RelayState:
                  type: string
              required:
                - SAMLResponse
                - RelayState
      responses:
        "302":
          description: Release-aware tenant-scoped SAML callback redirect
        "401":
          description: Invalid, expired, or cross-tenant assertion state
      security: []
  /api/t/{tenantSlug}/auth/sso-config:
    get:
      operationId: getTByTenantSlugAuthSsoConfig
      tags:
        - Auth & Health
      parameters:
        - schema:
            type: string
          required: true
          name: tenantSlug
          in: path
      responses:
        "200":
          description: Resolved SSO requirement for the tenant login experience
          content:
            application/json:
              schema:
                type: object
                properties:
                  ssoRequired:
                    type: boolean
                required:
                  - ssoRequired
                additionalProperties: false
      security: []
  /api/t/{tenantSlug}/invitations/capabilities:
    get:
      operationId: getTByTenantSlugInvitationsCapabilities
      tags:
        - Auth & Health
      parameters:
        - schema:
            type: string
          required: true
          name: tenantSlug
          in: path
      responses:
        "200":
          description: Invitation readiness flags for the authenticated tenant UI
          content:
            application/json:
              schema:
                type: object
                properties:
                  ssoRequired:
                    type: boolean
                  emailConfigured:
                    type: boolean
                required:
                  - ssoRequired
                  - emailConfigured
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/t/{tenantSlug}/invitations:
    post:
      operationId: postTByTenantSlugInvitations
      tags:
        - Auth & Health
      parameters:
        - schema:
            type: string
          required: true
          name: tenantSlug
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                resourceType:
                  type: string
                  enum:
                    - tenant
                    - project
                    - engine
                resourceId:
                  type: string
                resourceName:
                  type: string
                role:
                  type: string
                deliveryMethod:
                  type: string
                  enum:
                    - email
                    - manual
                  default: email
              required:
                - email
                - resourceType
      responses:
        "201":
          description: Invitation created. Manual delivery may include reveal-once onboarding details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invited:
                    type: boolean
                    enum:
                      - true
                  emailSent:
                    type: boolean
                  emailError:
                    type: string
                  inviteUrl:
                    type: string
                  oneTimePassword:
                    type: string
                required:
                  - invited
                  - emailSent
        "403":
          description: Forbidden
      security:
        - BearerAuth: []
        - CookieAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token returned by the login endpoints, sent as `Authorization: Bearer <token>`."
    CookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: Access token cookie set by the browser login flows. Mutating requests also need the XSRF header.
  schemas:
    AccessAuthorityMode:
      type: string
      enum:
        - manual
        - transition_to_sso
        - sso_managed
      description: Controls manual membership and scoped role-assignment mutations. SSO-managed mode preserves existing rows as effective, view-only access.
    AuthenticatedSessionLoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthenticatedSessionUser"
        expiresIn:
          type: number
          minimum: 0
          exclusiveMinimum: true
        emailVerificationRequired:
          type: boolean
      required:
        - user
        - expiresIn
      additionalProperties: false
    AuthenticatedSessionUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        platformRole:
          type: string
          enum:
            - admin
            - user
        capabilities:
          type: object
          additionalProperties:
            type: boolean
        isActive:
          type: boolean
        isEmailVerified:
          type: boolean
        mustResetPassword:
          type: boolean
        createdAt:
          anyOf:
            - type: number
            - type: string
              pattern: ^\d+$
        lastLoginAt:
          anyOf:
            - type: number
            - type: string
              pattern: ^\d+$
            - nullable: true
        session:
          type: object
          properties:
            principal:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - user
                id:
                  type: string
              required:
                - type
                - id
            tenant:
              type: object
              properties:
                id:
                  type: string
                  nullable: true
              required:
                - id
          required:
            - principal
            - tenant
      required:
        - id
        - email
        - session
      additionalProperties:
        nullable: true
    ConfigBootstrapStatus:
      type: object
      properties:
        mode:
          type: string
          enum:
            - disabled
            - validate
            - apply
        status:
          type: string
          enum:
            - disabled
            - validated
            - applied
            - failed
        hash:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        reconciliation:
          type: string
          enum:
            - not_run
            - completed
            - pending
        secretPreflight:
          type: string
          enum:
            - not_required
            - passed
            - failed
        issueCode:
          type: string
          nullable: true
          enum:
            - bundle_path_missing
            - bundle_read_failed
            - hash_mismatch
            - validation_failed
            - secret_preflight_failed
            - tenant_scope_missing
            - apply_failed
            - identity_reconciliation_failed
            - null
      required:
        - mode
        - status
        - hash
        - message
        - reconciliation
        - secretPreflight
        - issueCode
    EngineOnboardingMode:
      type: string
      enum:
        - manual_allowed
        - external_only
        - hybrid
      description: Controls manual engine inventory lifecycle operations. Configuration bundles and the external registration API retain their own source-owned paths.
    EngineRuntimeAuthorizationMode:
      type: string
      enum:
        - enterpriseglue_authoritative
        - mirrored_engine_backstop
      description: Controls runtime authorization authority independently from authentication, engine onboarding, and membership management.
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        configBootstrap:
          $ref: "#/components/schemas/ConfigBootstrapStatus"
      required:
        - status
        - configBootstrap
    NativeTenantMembership:
      type: object
      properties:
        tenantId:
          type: string
          minLength: 1
        tenantSlug:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
        tenantName:
          type: string
          minLength: 1
        tenantStatus:
          type: string
          enum:
            - active
            - suspended
            - deleting
        role:
          type: string
          enum:
            - admin
            - member
      required:
        - tenantId
        - tenantSlug
        - tenantName
        - tenantStatus
        - role
    PlatformGovernanceBehavior:
      type: object
      properties:
        manualEngineAccessMutationsAllowed:
          type: boolean
        manualProjectAccessMutationsAllowed:
          type: boolean
        manualEngineRegistrationAllowed:
          type: boolean
        manualProjectEngineTargetMutationsAllowed:
          type: boolean
        governanceSettingsMutations:
          type: string
          enum:
            - allowed
            - allowed_marks_drift
            - blocked
      required:
        - manualEngineAccessMutationsAllowed
        - manualProjectAccessMutationsAllowed
        - manualEngineRegistrationAllowed
        - manualProjectEngineTargetMutationsAllowed
        - governanceSettingsMutations
      additionalProperties: false
    ProjectEngineTargetPolicyMode:
      type: string
      enum:
        - manual_allowed
        - external_only
        - hybrid
      description: Controls manual project-to-engine deployment-target changes independently from project creation and engine access.
    PublicPlatformSettings:
      type: object
      properties:
        syncPushEnabled:
          type: boolean
        syncPullEnabled:
          type: boolean
        gitProjectTokenSharingEnabled:
          type: boolean
        defaultDeployRoles:
          type: array
          items:
            type: string
        engineOnboardingMode:
          $ref: "#/components/schemas/EngineOnboardingMode"
        projectEngineTargetMode:
          $ref: "#/components/schemas/ProjectEngineTargetPolicyMode"
        engineAccessAuthority:
          $ref: "#/components/schemas/AccessAuthorityMode"
        projectAccessAuthority:
          $ref: "#/components/schemas/AccessAuthorityMode"
        engineRuntimeAuthorizationMode:
          $ref: "#/components/schemas/EngineRuntimeAuthorizationMode"
        governanceBehavior:
          $ref: "#/components/schemas/PlatformGovernanceBehavior"
        credentiallessCustomerSidecarsEnabled:
          type: boolean
        ssoAllEnginesAssignmentMappingsEnabled:
          type: boolean
        ssoEngineOwnerAssignmentMappingsEnabled:
          type: boolean
        ssoEngineDelegateAssignmentMappingsEnabled:
          type: boolean
        ssoRegexClaimMappingsEnabled:
          type: boolean
        ssoBroadEntitlementMappingsEnabled:
          type: boolean
        ssoSecretViewMappingsEnabled:
          type: boolean
        ssoUnredactedAuditMappingsEnabled:
          type: boolean
        ssoPermanentDeleteMappingsEnabled:
          type: boolean
      required:
        - syncPushEnabled
        - syncPullEnabled
        - gitProjectTokenSharingEnabled
        - defaultDeployRoles
        - engineOnboardingMode
        - projectEngineTargetMode
        - engineAccessAuthority
        - projectAccessAuthority
        - engineRuntimeAuthorizationMode
        - governanceBehavior
        - credentiallessCustomerSidecarsEnabled
        - ssoAllEnginesAssignmentMappingsEnabled
        - ssoEngineOwnerAssignmentMappingsEnabled
        - ssoEngineDelegateAssignmentMappingsEnabled
        - ssoRegexClaimMappingsEnabled
        - ssoBroadEntitlementMappingsEnabled
        - ssoSecretViewMappingsEnabled
        - ssoUnredactedAuditMappingsEnabled
        - ssoPermanentDeleteMappingsEnabled
    Readiness:
      type: object
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        configBootstrap:
          $ref: "#/components/schemas/ConfigBootstrapStatus"
      required:
        - status
        - configBootstrap
    TenantDiscoveryResponse:
      oneOf:
        - type: object
          properties:
            status:
              type: string
              enum:
                - resolved
            tenantSlug:
              type: string
              minLength: 1
              maxLength: 63
              pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
            loginPath:
              type: string
              pattern: ^\/t\/[a-z0-9-]+\/login$
          required:
            - status
            - tenantSlug
            - loginPath
        - type: object
          properties:
            status:
              type: string
              enum:
                - verification_sent
            message:
              type: string
              minLength: 1
          required:
            - status
            - message
  parameters: {}
