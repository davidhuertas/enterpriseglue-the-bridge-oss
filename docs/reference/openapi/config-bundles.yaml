                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              enum:
                                - CONFIG_BUNDLE_V1ALPHA1_DEPRECATED
                                - CONFIG_BUNDLE_V1ALPHA1_GOVERNANCE_ALIASES_NORMALIZED
                            message:
                              type: string
                          required:
                            - code
                            - message
                          additionalProperties: false
                    required:
                      - inputApiVersion
                      - normalizedApiVersion
                      - warnings
                    additionalProperties: false
                required:
                  - bundle
                  - files
                  - contract
      security:
        - BearerAuth: []
        - CookieAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token returned by the login endpoints, sent as `Authorization: Bearer <token>`."
    CookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: Access token cookie set by the browser login flows. Mutating requests also need the XSRF header.
  schemas:
    ActiveSourcesResponse:
      type: object
      additionalProperties:
        type: integer
        minimum: 0
    ConfigBootstrapStatus:
      type: object
      properties:
        mode:
          type: string
          enum:
            - disabled
            - validate
            - apply
        status:
          type: string
          enum:
            - disabled
            - validated
            - applied
            - failed
        hash:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        reconciliation:
          type: string
          enum:
            - not_run
            - completed
            - pending
        secretPreflight:
          type: string
          enum:
            - not_required
            - passed
            - failed
        issueCode:
          type: string
          nullable: true
          enum:
            - bundle_path_missing
            - bundle_read_failed
            - hash_mismatch
            - validation_failed
            - secret_preflight_failed
            - tenant_scope_missing
            - apply_failed
            - identity_reconciliation_failed
            - null
      required:
        - mode
        - status
        - hash
        - message
        - reconciliation
        - secretPreflight
        - issueCode
    ConfigBundle:
      oneOf:
        - type: object
          properties:
            apiVersion:
              type: string
              enum:
                - enterpriseglue.ai/v1alpha1
            kind:
              type: string
              enum:
                - EnterpriseGlueConfigBundle
            metadata:
              type: object
              properties:
                key:
                  type: string
                  minLength: 3
                  maxLength: 160
                  pattern: ^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$
                description:
                  type: string
                  maxLength: 2000
                owner:
                  type: string
                  minLength: 1
                  maxLength: 255
              required:
                - key
                - owner
              additionalProperties: false
            tenantKey:
              type: string
              minLength: 3
              maxLength: 160
              pattern: ^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$
            mode:
              type: string
              enum:
                - additive
                - authoritative
                - preview_only
            imports:
              type: array
              items:
                type: string
                enum:
                  - ./platform-settings.json
                  - ./environment-tags.json
                  - ./git-providers.json
                  - ./email-configurations.json
                  - ./email-templates.json
                  - ./permissions.json
                  - ./authorization-policies.json
                  - ./machine-principals.json
                  - ./external-engine-systems.json
                  - ./engines.json
                  - ./engine-backstop-mappings.json
                  - ./engine-tenant-mappings.json
                  - ./engine-sets.json
                  - ./runtime-resource-sets.json
                  - ./roles.json
                  - ./groups.json
                  - ./assignments.json
                  - ./identity-providers.json
                  - ./identity-provisioning-directories.json
                  - ./identity-mappings.json
                  - ./project-engine-targets.json
              minItems: 1
            settings:
              type: object
              properties:
                engineAccessAuthority:
                  type: string
                  enum:
                    - manual
                    - transition_to_sso
                    - sso_managed
                  default: manual
                  description: Engine membership and scoped assignment authority. This does not register engines or change runtime scope.
                projectAccessAuthority:
                  type: string
                  enum:
                    - manual
                    - transition_to_sso
                    - sso_managed
                  default: manual
                  description: Project membership and scoped assignment authority. This does not control project creation.
                engineOnboardingMode:
                  type: string
                  enum:
                    - manual_allowed
                    - external_only
                    - hybrid
                  default: manual_allowed
                  description: Manual engine inventory policy. Engine records remain in ./engines.json or the external registration API.
                projectEngineTargetMode:
                  type: string
                  enum:
                    - manual_allowed
                    - external_only
                    - hybrid
                  default: manual_allowed
                  description: Manual project-engine target policy. This is separate from engine membership and project creation.
                engineRuntimeAuthorizationMode:
                  type: string
                  enum:
                    - enterpriseglue_authoritative
                    - mirrored_engine_backstop
                  default: enterpriseglue_authoritative
                  description: Runtime authorization authority; runtimeAccessScope remains a per-engine field in ./engines.json.
                ownershipMode:
                  type: string
                  enum:
                    - config_locked
                    - config_warn
                    - manual
                  default: config_locked
                  description: Ownership of this settings block only, not ownership of engine, member, group, or assignment rows.
              default:
                engineAccessAuthority: manual
                projectAccessAuthority: manual
                engineOnboardingMode: manual_allowed
                projectEngineTargetMode: manual_allowed
                engineRuntimeAuthorizationMode: enterpriseglue_authoritative
                ownershipMode: config_locked
              additionalProperties: false
              description: Deprecated v1alpha1 governance aliases. Use the v1beta1 governance block for new bundles.
          required:
            - apiVersion
            - kind
            - metadata
            - tenantKey
            - mode
            - imports
          additionalProperties: false
        - type: object
          properties:
            apiVersion:
              type: string
              enum:
                - enterpriseglue.ai/v1beta1
            kind:
              type: string
              enum:
                - EnterpriseGlueConfigBundle
            metadata:
              type: object
              properties:
                key:
                  type: string
                  minLength: 3
                  maxLength: 160
                  pattern: ^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$
                description:
                  type: string
                  maxLength: 2000
                owner:
                  type: string
                  minLength: 1
                  maxLength: 255
              required:
                - key
                - owner
              additionalProperties: false
            tenantKey:
              type: string
              minLength: 3
              maxLength: 160
              pattern: ^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$
            mode:
              type: string
              enum:
                - additive
                - authoritative
                - preview_only
            imports:
              type: array
              items:
                type: string
                enum:
                  - ./platform-settings.json
                  - ./environment-tags.json
                  - ./git-providers.json
                  - ./email-configurations.json
                  - ./email-templates.json
                  - ./permissions.json
                  - ./authorization-policies.json
                  - ./machine-principals.json
                  - ./external-engine-systems.json
                  - ./engines.json
                  - ./engine-backstop-mappings.json
                  - ./engine-tenant-mappings.json
                  - ./engine-sets.json
                  - ./runtime-resource-sets.json
                  - ./roles.json
                  - ./groups.json
                  - ./assignments.json
                  - ./identity-providers.json
                  - ./identity-provisioning-directories.json
                  - ./identity-mappings.json
                  - ./project-engine-targets.json
              minItems: 1
            governance:
              type: object
              properties:
                engineMembershipAuthority:
                  type: string
                  enum:
                    - manual
                    - transition_to_sso
                    - sso_managed
                  default: manual
                  description: Authority for engine membership and scoped engine assignments only.
                projectMembershipAuthority:
                  type: string
                  enum:
                    - manual
                    - transition_to_sso
                    - sso_managed
                  default: manual
                  description: Authority for project membership and scoped project assignments only.
                engineRegistrationPolicy:
                  type: string
                  enum:
                    - manual_allowed
                    - external_only
                    - hybrid
                  default: manual_allowed
                  description: Policy for registering engine inventory; unrelated to membership authority.
                projectEngineTargetPolicy:
                  type: string
                  enum:
                    - manual_allowed
                    - external_only
                    - hybrid
                  default: manual_allowed
                  description: Policy for managing project-to-engine deployment targets.
                runtimeAuthorizationAuthority:
                  type: string
                  enum:
                    - enterpriseglue_authoritative
                    - mirrored_engine_backstop
                  default: enterpriseglue_authoritative
                  description: Authority for runtime-resource authorization decisions.
                governanceSettingsOwnership:
                  type: string
                  enum:
                    - config_locked
                    - config_warn
                    - manual
                  default: config_locked
                  description: Ownership of this governance block only, never ownership of managed object rows.
              default:
                engineMembershipAuthority: manual
                projectMembershipAuthority: manual
                engineRegistrationPolicy: manual_allowed
                projectEngineTargetPolicy: manual_allowed
                runtimeAuthorizationAuthority: enterpriseglue_authoritative
                governanceSettingsOwnership: config_locked
              additionalProperties: false
              description: Optional platform governance policy. Omit it when this bundle must not claim or reset governance settings.
            login:
              type: object
              properties:
                localPassword:
                  type: string
                  enum:
                    - auto
                    - enabled
                    - disabled
                  description: Whether ordinary local password sign-in is automatic, always enabled, or disabled.
                providerSelection:
                  type: string
                  enum:
                    - auto_redirect_single
                    - chooser
                    - progressive
                  description: Whether to redirect a single provider, always show a chooser, or use email-domain discovery.
              required:
                - localPassword
                - providerSelection
              additionalProperties: false
              description: Optional ordinary-user login policy. Administrator recovery is intentionally configured separately and cannot be disabled by this block.
          required:
            - apiVersion
            - kind
            - metadata
            - tenantKey
            - mode
            - imports
          additionalProperties: false
