openapi: 3.0.3
info:
  title: EnterpriseGlue Config Bundles API
  version: 0.1.0
  description: |-
    Headless configuration bundles: import, preview, diff, apply, export and governance ownership.

    Tenant-scoped routes under `/api/t/{tenantSlug}/...` are also served at the legacy alias `/t/{tenantSlug}/api/...`; only the first form is documented.
servers:
  - url: /
    description: This EnterpriseGlue deployment
tags:
  - name: Config Bundles
    description: "Headless configuration bundles: import, preview, diff, apply, export and governance ownership."
paths:
  /api/authz/config-bundles/import-zip:
    post:
      operationId: postAuthzConfigBundlesImportZip
      tags:
        - Config Bundles
      requestBody:
        content:
          application/zip:
            schema:
              type: string
          application/octet-stream:
            schema:
              type: string
      responses:
        "200":
          description: Convert a validated folder-style configuration ZIP into the standard bundle envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigBundleRequest"
        "422":
          description: Invalid configuration ZIP archive
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/authz/config-bundles/import-url:
    post:
      operationId: postAuthzConfigBundlesImportUrl
      tags:
        - Config Bundles
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  maxLength: 2048
                  format: uri
              required:
                - url
              additionalProperties: false
      responses:
        "200":
          description: Import a bounded GitHub or GitLab raw JSON/ZIP configuration file into the standard bundle envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigBundleRequest"
        "422":
          description: Unsupported or invalid remote configuration source
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/authz/config-bundles/preview:
    post:
      operationId: postAuthzConfigBundlesPreview
      tags:
        - Config Bundles
      summary: Preview a headless authorization and engine configuration bundle
      description: Validates the manifest and imported object files without persistence. Use v1beta1 governance names for new bundles. Omit bundle.governance for engine-only or identity-only bundles that must not claim platform governance settings; v1alpha1 settings aliases remain accepted with warnings.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigBundleRequest"
      responses:
        "200":
          description: Validated config bundle preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  canonicalHash:
                    type: string
                  contract:
                    type: object
                    properties:
                      inputApiVersion:
                        type: string
                        enum:
                          - enterpriseglue.ai/v1alpha1
                          - enterpriseglue.ai/v1beta1
                      normalizedApiVersion:
                        type: string
                        enum:
                          - enterpriseglue.ai/v1beta1
                      warnings:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              enum:
                                - CONFIG_BUNDLE_V1ALPHA1_DEPRECATED
                                - CONFIG_BUNDLE_V1ALPHA1_GOVERNANCE_ALIASES_NORMALIZED
                            message:
                              type: string
                          required:
                            - code
                            - message
                          additionalProperties: false
                    required:
                      - inputApiVersion
                      - normalizedApiVersion
                      - warnings
                    additionalProperties: false
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        path:
                          type: string
                        message:
                          type: string
                        severity:
                          type: string
                          enum:
                            - error
                        remediation:
                          type: string
                        objectKey:
                          type: string
                      required:
                        - path
                        - message
                        - severity
                        - remediation
                  counts:
                    $ref: "#/components/schemas/ActiveSourcesResponse"
                  expandedRolePermissions:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  roleTemplateBaselines:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        copyFromRoleKey:
                          type: string
                        fingerprint:
                          type: string
                        permissions:
                          type: array
                          items:
                            type: string
                      required:
                        - copyFromRoleKey
                        - fingerprint
                        - permissions
                required:
                  - valid
                  - errors
                  - counts
        "422":
          description: Invalid config bundle preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  canonicalHash:
                    type: string
                  contract:
                    type: object
                    properties:
                      inputApiVersion:
                        type: string
                        enum:
                          - enterpriseglue.ai/v1alpha1
                          - enterpriseglue.ai/v1beta1
                      normalizedApiVersion:
                        type: string
                        enum:
                          - enterpriseglue.ai/v1beta1
                      warnings:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              enum:
                                - CONFIG_BUNDLE_V1ALPHA1_DEPRECATED
                                - CONFIG_BUNDLE_V1ALPHA1_GOVERNANCE_ALIASES_NORMALIZED
                            message:
                              type: string
                          required:
                            - code
                            - message
                          additionalProperties: false
                    required:
                      - inputApiVersion
                      - normalizedApiVersion
                      - warnings
                    additionalProperties: false
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        path:
                          type: string
                        message:
                          type: string
                        severity:
                          type: string
                          enum:
                            - error
                        remediation:
                          type: string
                        objectKey:
                          type: string
                      required:
                        - path
                        - message
                        - severity
                        - remediation
                  counts:
                    $ref: "#/components/schemas/ActiveSourcesResponse"
                  expandedRolePermissions:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  roleTemplateBaselines:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        copyFromRoleKey:
                          type: string
                        fingerprint:
                          type: string
                        permissions:
                          type: array
                          items:
                            type: string
                      required:
                        - copyFromRoleKey
                        - fingerprint
                        - permissions
                required:
                  - valid
                  - errors
                  - counts
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/authz/config-bundles/validate-secret-refs:
    post:
      operationId: postAuthzConfigBundlesValidateSecretRefs
      tags:
        - Config Bundles
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigBundleRequest"
      responses:
        "200":
          description: Secret-reference availability without secret values
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  canonicalHash:
                    type: string
                  contract:
                    type: object
                    properties:
                      inputApiVersion:
                        type: string
                        enum:
                          - enterpriseglue.ai/v1alpha1
                          - enterpriseglue.ai/v1beta1
                      normalizedApiVersion:
                        type: string
                        enum:
                          - enterpriseglue.ai/v1beta1
                      warnings:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              enum:
                                - CONFIG_BUNDLE_V1ALPHA1_DEPRECATED
                                - CONFIG_BUNDLE_V1ALPHA1_GOVERNANCE_ALIASES_NORMALIZED
                            message:
                              type: string
                          required:
                            - code
                            - message
                          additionalProperties: false
                    required:
                      - inputApiVersion
                      - normalizedApiVersion
                      - warnings
                    additionalProperties: false
                  availabilityHash:
                    type: string
                  available:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        path:
                          type: string
                        message:
                          type: string
                        severity:
                          type: string
                          enum:
                            - error
                        remediation:
                          type: string
                        objectKey:
                          type: string
                      required:
                        - path
                        - message
                        - severity
                        - remediation
                  references:
                    type: array
                    items:
                      type: object
                      properties:
                        reference:
                          type: string
                        locations:
                          type: array
                          items:
                            type: string
                        available:
                          type: boolean
                        reason:
                          type: string
                          enum:
                            - file_provider_not_configured
                            - file_outside_root
                            - file_unavailable
                            - docker_secret_provider_not_configured
                            - docker_secret_invalid_name
                            - docker_secret_unavailable
                            - environment_variable_missing
                      required:
                        - reference
                        - locations
                        - available
                required:
                  - valid
                  - available
                  - errors
                  - references
        "422":
          description: Invalid configuration bundle
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  canonicalHash:
                    type: string
                  contract:
                    type: object
                    properties:
                      inputApiVersion:
                        type: string
                        enum:
                          - enterpriseglue.ai/v1alpha1
                          - enterpriseglue.ai/v1beta1
                      normalizedApiVersion:
                        type: string
                        enum:
                          - enterpriseglue.ai/v1beta1
                      warnings:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              enum:
                                - CONFIG_BUNDLE_V1ALPHA1_DEPRECATED
                                - CONFIG_BUNDLE_V1ALPHA1_GOVERNANCE_ALIASES_NORMALIZED
                            message:
                              type: string
                          required:
                            - code
                            - message
                          additionalProperties: false
                    required:
                      - inputApiVersion
                      - normalizedApiVersion
                      - warnings
                    additionalProperties: false
                  availabilityHash:
                    type: string
                  available:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        path:
                          type: string
                        message:
                          type: string
                        severity:
                          type: string
                          enum:
                            - error
                        remediation:
                          type: string
                        objectKey:
                          type: string
                      required:
                        - path
                        - message
                        - severity
                        - remediation
                  references:
                    type: array
                    items:
                      type: object
                      properties:
                        reference:
                          type: string
                        locations:
                          type: array
                          items:
                            type: string
                        available:
                          type: boolean
                        reason:
                          type: string
                          enum:
                            - file_provider_not_configured
                            - file_outside_root
                            - file_unavailable
                            - docker_secret_provider_not_configured
                            - docker_secret_invalid_name
                            - docker_secret_unavailable
                            - environment_variable_missing
                      required:
                        - reference
                        - locations
                        - available
                required:
                  - valid
                  - available
                  - errors
                  - references
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/authz/config-bundles/diff:
    post:
      operationId: postAuthzConfigBundlesDiff
      tags:
        - Config Bundles
      summary: Diff a headless configuration bundle against persisted state
      description: Reports persisted changes without mutation. Platform governance appears only when the raw manifest explicitly declares at least one governance field.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigBundleRequest"
      responses:
        "200":
          description: Persisted config bundle diff
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  canonicalHash:
                    type: string
                  contract:
                    type: object
                    properties:
                      inputApiVersion:
                        type: string
                        enum:
                          - enterpriseglue.ai/v1alpha1
                          - enterpriseglue.ai/v1beta1
                      normalizedApiVersion:
                        type: string
                        enum:
                          - enterpriseglue.ai/v1beta1
                      warnings:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              enum:
                                - CONFIG_BUNDLE_V1ALPHA1_DEPRECATED
                                - CONFIG_BUNDLE_V1ALPHA1_GOVERNANCE_ALIASES_NORMALIZED
                            message:
                              type: string
                          required:
                            - code
                            - message
                          additionalProperties: false
                    required:
                      - inputApiVersion
                      - normalizedApiVersion
                      - warnings
                    additionalProperties: false
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        path:
                          type: string
                        message:
                          type: string
                        severity:
                          type: string
                          enum:
                            - error
                        remediation:
                          type: string
                        objectKey:
                          type: string
                      required:
                        - path
                        - message
                        - severity
                        - remediation
                  counts:
                    $ref: "#/components/schemas/ActiveSourcesResponse"
                  expandedRolePermissions:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  roleTemplateBaselines:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        copyFromRoleKey:
                          type: string
                        fingerprint:
                          type: string
                        permissions:
                          type: array
                          items:
                            type: string
                      required:
                        - copyFromRoleKey
                        - fingerprint
                        - permissions
                  changes:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConfigBundleDiffChange"
                  warnings:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        message:
                          type: string
                        acknowledgementId:
                          type: string
                      required:
                        - id
                        - message
                  requiredAcknowledgements:
                    type: array
                    items:
                      type: string
                  affectedPrincipals:
                    type: object
                    properties:
                      affectedGroupCount:
                        type: integer
                        minimum: 0
                      affectedUserCount:
                        type: integer
                        minimum: 0
                      externalIdentityMappingChangeCount:
                        type: integer
                        minimum: 0
                    required:
                      - affectedGroupCount
                      - affectedUserCount
                      - externalIdentityMappingChangeCount
                required:
                  - valid
                  - errors
                  - counts
                  - changes
                  - warnings
                  - requiredAcknowledgements
                  - affectedPrincipals
        "422":
          description: Invalid config bundle input
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  canonicalHash:
                    type: string
                  contract:
                    type: object
                    properties:
                      inputApiVersion:
                        type: string
                        enum:
                          - enterpriseglue.ai/v1alpha1
                          - enterpriseglue.ai/v1beta1
                      normalizedApiVersion:
                        type: string
                        enum:
                          - enterpriseglue.ai/v1beta1
                      warnings:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              enum:
                                - CONFIG_BUNDLE_V1ALPHA1_DEPRECATED
                                - CONFIG_BUNDLE_V1ALPHA1_GOVERNANCE_ALIASES_NORMALIZED
                            message:
                              type: string
                          required:
                            - code
                            - message
                          additionalProperties: false
                    required:
                      - inputApiVersion
                      - normalizedApiVersion
                      - warnings
                    additionalProperties: false
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        path:
                          type: string
                        message:
                          type: string
                        severity:
                          type: string
                          enum:
                            - error
                        remediation:
                          type: string
                        objectKey:
                          type: string
                      required:
                        - path
                        - message
                        - severity
                        - remediation
                  counts:
                    $ref: "#/components/schemas/ActiveSourcesResponse"
                  expandedRolePermissions:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  roleTemplateBaselines:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        copyFromRoleKey:
                          type: string
                        fingerprint:
                          type: string
                        permissions:
                          type: array
                          items:
                            type: string
                      required:
                        - copyFromRoleKey
                        - fingerprint
                        - permissions
                  changes:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConfigBundleDiffChange"
                  warnings:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        message:
                          type: string
                        acknowledgementId:
                          type: string
                      required:
                        - id
                        - message
                  requiredAcknowledgements:
                    type: array
                    items:
                      type: string
                  affectedPrincipals:
                    type: object
                    properties:
                      affectedGroupCount:
                        type: integer
                        minimum: 0
                      affectedUserCount:
                        type: integer
                        minimum: 0
                      externalIdentityMappingChangeCount:
                        type: integer
                        minimum: 0
                    required:
                      - affectedGroupCount
                      - affectedUserCount
                      - externalIdentityMappingChangeCount
                required:
                  - valid
                  - errors
                  - counts
                  - changes
                  - warnings
                  - requiredAcknowledgements
                  - affectedPrincipals
      security:
        - BearerAuth: []
        - CookieAuth: []
  /api/authz/config-bundles/apply:
    post:
      operationId: postAuthzConfigBundlesApply
      tags:
        - Config Bundles
      summary: Apply an exact reviewed headless configuration preview
      description: Applies the exact canonical preview hash. Platform governance is changed only when the raw manifest explicitly declares at least one version-appropriate governance field; omitted v1beta1 governance (or v1alpha1 settings) never claims or resets portal-owned values.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bundle:
                  nullable: true
                files:
                  type: object
                  additionalProperties:
                    nullable: true
                contract:
                  type: object
                  properties:
                    inputApiVersion:
                      type: string
                      enum:
                        - enterpriseglue.ai/v1alpha1
                        - enterpriseglue.ai/v1beta1
                    normalizedApiVersion:
                      type: string
                      enum:
                        - enterpriseglue.ai/v1beta1
                    warnings:
                      type: array
                      items:
                        type: object
                        properties:
                          code:
                            type: string
                            enum:
                              - CONFIG_BUNDLE_V1ALPHA1_DEPRECATED
                              - CONFIG_BUNDLE_V1ALPHA1_GOVERNANCE_ALIASES_NORMALIZED
                          message:
                            type: string
                        required:
                          - code
                          - message
                        additionalProperties: false
                  required:
                    - inputApiVersion
                    - normalizedApiVersion
                    - warnings
                  additionalProperties: false
                expectedPreviewHash:
                  type: string
                  minLength: 1
                expectedSecretPreflightHash:
                  type: string
                  minLength: 1
                  maxLength: 255
                acknowledgements:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 500
                  maxItems: 100
                idempotencyKey:
                  type: string
                  minLength: 8
                  maxLength: 160
                expectedTenantScope:
                  type: string
                  minLength: 1
                  maxLength: 255
                identityReconciliationMode:
                  type: string
                  enum:
                    - none
                    - preview
                    - apply
                ciProvenance:
                  type: object
                  properties:
                    repository:
                      type: string
                      minLength: 3
                      maxLength: 255
                      pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*\/[A-Za-z0-9][A-Za-z0-9_.-]*$
                    revision:
                      type: string
                      pattern: ^[0-9a-f]{40}$/i
                    workflowRunId:
                      type: string
                      minLength: 1
                      maxLength: 64
                      pattern: ^[0-9]+$
                    workflow:
                      type: string
                      minLength: 1
                      maxLength: 160
                  required:
                    - repository
                    - revision
                    - workflowRunId
                  additionalProperties: false
              required:
                - files
                - expectedPreviewHash
              additionalProperties: false
      responses:
        "200":
          description: Applied config bundle with all requested reconciliation complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  canonicalHash:
                    type: string
                  contract:
                    type: object
                    properties:
                      inputApiVersion:
                        type: string
                        enum:
                          - enterpriseglue.ai/v1alpha1
                          - enterpriseglue.ai/v1beta1
                      normalizedApiVersion:
                        type: string
                        enum:
                          - enterpriseglue.ai/v1beta1
                      warnings:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              enum:
                                - CONFIG_BUNDLE_V1ALPHA1_DEPRECATED
                                - CONFIG_BUNDLE_V1ALPHA1_GOVERNANCE_ALIASES_NORMALIZED
                            message:
                              type: string
                          required:
                            - code
                            - message
                          additionalProperties: false
                    required:
                      - inputApiVersion
                      - normalizedApiVersion
                      - warnings
                    additionalProperties: false
                  created:
                    type: integer
                    minimum: 0
                  updated:
                    type: integer
                    minimum: 0
                  archived:
                    type: integer
                    minimum: 0
                  changes:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConfigBundleDiffChange"
                  reconciliation:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - completed
                      engineSetCount:
                        type: integer
                        minimum: 0
                      runtimeResourceSetCount:
                        type: integer
                        minimum: 0
                      engineCount:
                        type: integer
                        minimum: 0
                      identitySnapshot:
                        type: object
                        properties:
                          mode:
                            type: string
                            enum:
                              - none
                              - preview
                              - apply
                          status:
                            type: string
                            enum:
                              - not_needed
                              - skipped
                              - previewed
                              - completed
                              - truncated
                              - failed
                          providerCount:
                            type: integer
                            minimum: 0
                          scanned:
                            type: integer
                            minimum: 0
                          created:
                            type: integer
                            minimum: 0
                          removed:
                            type: integer
                            minimum: 0
                          failed:
                            type: integer
                            minimum: 0
                        required:
                          - mode
                          - status
                          - providerCount
                          - scanned
                          - created
                          - removed
                          - failed
                      runtimeReconciliation:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - not_needed
                              - queued
                              - completed
                              - failed
                          taskId:
                            type: string
                            nullable: true
                          engineSetCount:
                            type: integer
                            minimum: 0
                          runtimeResourceSetCount:
                            type: integer
                            minimum: 0
                          engineCount:
                            type: integer
                            minimum: 0
                        required:
                          - status
                          - taskId
                          - engineSetCount
                          - runtimeResourceSetCount
                          - engineCount
                    required:
                      - status
                      - engineSetCount
                      - runtimeResourceSetCount
                      - engineCount
                      - identitySnapshot
                      - runtimeReconciliation
                  idempotent:
                    type: boolean
                  applyRunId:
                    type: string
                required:
                  - canonicalHash
                  - created
                  - updated
                  - archived
                  - changes
                  - reconciliation
        "202":
          description: Applied config bundle with durable identity or runtime reconciliation queued; inspect applyRunId and task receipts
          content:
            application/json:
              schema:
                type: object
                properties:
                  canonicalHash:
                    type: string
                  contract:
                    type: object
                    properties:
                      inputApiVersion:
                        type: string
                        enum:
                          - enterpriseglue.ai/v1alpha1
                          - enterpriseglue.ai/v1beta1
                      normalizedApiVersion:
                        type: string
                        enum:
                          - enterpriseglue.ai/v1beta1
                      warnings:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              enum:
                                - CONFIG_BUNDLE_V1ALPHA1_DEPRECATED
                                - CONFIG_BUNDLE_V1ALPHA1_GOVERNANCE_ALIASES_NORMALIZED
                            message:
                              type: string
                          required:
                            - code
                            - message
                          additionalProperties: false
                    required:
                      - inputApiVersion
                      - normalizedApiVersion
                      - warnings
                    additionalProperties: false
                  created:
                    type: integer
                    minimum: 0
                  updated:
                    type: integer
                    minimum: 0
                  archived:
                    type: integer
                    minimum: 0
                  changes:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConfigBundleDiffChange"
                  reconciliation:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - completed
                      engineSetCount:
                        type: integer
                        minimum: 0
                      runtimeResourceSetCount:
