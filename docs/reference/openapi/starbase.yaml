openapi: 3.0.3
info:
  title: EnterpriseGlue Starbase & Git API
  version: 0.1.0
  description: |-
    Design-time projects, folders, files, versions, comments, deployments and Git/VCS synchronisation.

    Tenant-scoped routes under `/api/t/{tenantSlug}/...` are also served at the legacy alias `/t/{tenantSlug}/api/...`; only the first form is documented.
servers:
  - url: /
    description: This EnterpriseGlue deployment
tags:
  - name: Starbase & Git
    description: Design-time projects, folders, files, versions, comments, deployments and Git/VCS synchronisation.
paths:
  /starbase-api/projects:
    get:
      operationId: getStarbaseProjects
      tags:
        - Starbase & Git
      responses:
        "200":
          description: List projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectOverviewList"
      security:
        - BearerAuth: []
        - CookieAuth: []
    post:
      operationId: postStarbaseProjects
      tags:
        - Starbase & Git
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "200":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProjectResponse"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /starbase-api/projects/import-preview:
    post:
      operationId: postStarbaseProjectsImportPreview
      tags:
        - Starbase & Git
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectImportPreviewRequest"
      responses:
        "200":
          description: Preview latest BPMN/DMN definitions available for project import from an engine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectImportPreviewResponse"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /starbase-api/projects/{projectId}:
    patch:
      operationId: patchStarbaseProjectsByProjectId
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
          required: true
          name: projectId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameProjectRequest"
      responses:
        "200":
          description: Project renamed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                required:
                  - id
                  - name
        "404":
          description: Not found
      security:
        - BearerAuth: []
        - CookieAuth: []
    delete:
      operationId: deleteStarbaseProjectsByProjectId
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
          required: true
          name: projectId
          in: path
      responses:
        "204":
          description: Project deleted
        "404":
          description: Not found
      security:
        - BearerAuth: []
        - CookieAuth: []
  /starbase-api/projects/{projectId}/files:
    get:
      operationId: getStarbaseProjectsByProjectIdFiles
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
          required: true
          name: projectId
          in: path
      responses:
        "200":
          description: List files in project
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    folderId:
                      type: string
                      nullable: true
                    name:
                      type: string
                    type:
                      type: string
                    bpmnProcessId:
                      type: string
                      nullable: true
                    dmnDecisionId:
                      type: string
                      nullable: true
                    createdAt:
                      type: number
                    updatedAt:
                      type: number
                  required:
                    - id
                    - folderId
                    - name
                    - type
                    - createdAt
                    - updatedAt
      security:
        - BearerAuth: []
        - CookieAuth: []
    post:
      operationId: postStarbaseProjectsByProjectIdFiles
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
          required: true
          name: projectId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFileRequest"
      responses:
        "201":
          description: File created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  type:
                    type: string
                    enum:
                      - bpmn
                      - dmn
                  bpmnProcessId:
                    type: string
                    nullable: true
                  dmnDecisionId:
                    type: string
                    nullable: true
                  createdAt:
                    type: number
                  updatedAt:
                    type: number
                required:
                  - id
                  - name
                  - type
                  - bpmnProcessId
                  - dmnDecisionId
                  - createdAt
                  - updatedAt
      security:
        - BearerAuth: []
        - CookieAuth: []
  /starbase-api/files/{fileId}:
    get:
      operationId: getStarbaseFilesByFileId
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
          required: true
          name: fileId
          in: path
      responses:
        "200":
          description: Get file by id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "404":
          description: Not found
      security:
        - BearerAuth: []
        - CookieAuth: []
    put:
      operationId: putStarbaseFilesByFileId
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
          required: true
          name: fileId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFileXmlRequest"
      responses:
        "200":
          description: File XML updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  updatedAt:
                    type: number
                required:
                  - updatedAt
        "404":
          description: Not found
        "409":
          description: Conflict - file was modified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  currentUpdatedAt:
                    type: number
                required:
                  - message
                  - currentUpdatedAt
      security:
        - BearerAuth: []
        - CookieAuth: []
    patch:
      operationId: patchStarbaseFilesByFileId
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
          required: true
          name: fileId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFileMetadataRequest"
      responses:
        "200":
          description: File metadata updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  folderId:
                    type: string
                    nullable: true
                    format: uuid
                  updatedAt:
                    type: number
                required:
                  - id
                  - name
                  - folderId
                  - updatedAt
        "404":
          description: Not found
      security:
        - BearerAuth: []
        - CookieAuth: []
    delete:
      operationId: deleteStarbaseFilesByFileId
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
          required: true
          name: fileId
          in: path
      responses:
        "204":
          description: File deleted
        "404":
          description: Not found
      security:
        - BearerAuth: []
        - CookieAuth: []
  /starbase-api/projects/{projectId}/files/{fileId}/callers:
    get:
      operationId: getStarbaseProjectsByProjectIdFilesByFileIdCallers
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
          required: true
          name: projectId
          in: path
        - schema:
            type: string
          required: true
          name: fileId
          in: path
      responses:
        "200":
          description: List BPMN call activities that reference the target file
          content:
            application/json:
              schema:
                type: object
                properties:
                  callers:
                    type: array
                    items:
                      type: object
                      properties:
                        parentFileId:
                          type: string
                        parentFileName:
                          type: string
                        parentFolderId:
                          type: string
                          nullable: true
                        parentProcessId:
                          type: string
                          nullable: true
                        callActivityId:
                          type: string
                        callActivityName:
                          type: string
                          nullable: true
                      required:
                        - parentFileId
                        - parentFileName
                        - parentFolderId
                        - parentProcessId
                        - callActivityId
                        - callActivityName
                required:
                  - callers
      security:
        - BearerAuth: []
        - CookieAuth: []
  /starbase-api/files/{fileId}/comments:
    get:
      operationId: getStarbaseFilesByFileIdComments
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
          required: true
          name: fileId
          in: path
      responses:
        "200":
          description: List comments for a file
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /starbase-api/files/{fileId}/versions:
    get:
      operationId: getStarbaseFilesByFileIdVersions
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
          required: true
          name: fileId
          in: path
      responses:
        "200":
          description: List file versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Version"
      security:
        - BearerAuth: []
        - CookieAuth: []
    post:
      operationId: postStarbaseFilesByFileIdVersions
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
          required: true
          name: fileId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: File version created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  author:
                    type: string
                  message:
                    type: string
                  createdAt:
                    type: number
                required:
                  - id
                  - author
                  - message
                  - createdAt
      security:
        - BearerAuth: []
        - CookieAuth: []
  /starbase-api/files/{fileId}/versions/{versionId}:
    get:
      operationId: getStarbaseFilesByFileIdVersionsByVersionId
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
          required: true
          name: fileId
          in: path
        - schema:
            type: string
          required: true
          name: versionId
          in: path
      responses:
        "200":
          description: File version detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  fileId:
                    type: string
                  author:
                    type: string
                  message:
                    type: string
                  xml:
                    type: string
                  createdAt:
                    type: number
                required:
                  - id
                  - fileId
                  - author
                  - message
                  - xml
                  - createdAt
        "404":
          description: Not found
      security:
        - BearerAuth: []
        - CookieAuth: []
  /starbase-api/files/{fileId}/versions/{versionId}/restore:
    post:
      operationId: postStarbaseFilesByFileIdVersionsByVersionIdRestore
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
          required: true
          name: fileId
          in: path
        - schema:
            type: string
          required: true
          name: versionId
          in: path
      responses:
        "200":
          description: File restored from version
          content:
            application/json:
              schema:
                type: object
                properties:
                  restored:
                    type: boolean
                  fileId:
                    type: string
                  versionId:
                    type: string
                  updatedAt:
                    type: number
                required:
                  - restored
                  - fileId
                  - versionId
                  - updatedAt
        "404":
          description: Not found
      security:
        - BearerAuth: []
        - CookieAuth: []
  /starbase-api/versions/{versionId}/compare/{otherVersionId}:
    get:
      operationId: getStarbaseVersionsByVersionIdCompareByOtherVersionId
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
          required: true
          name: versionId
          in: path
        - schema:
            type: string
          required: true
          name: otherVersionId
          in: path
      responses:
        "200":
          description: Version comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompareVersionsResponse"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /starbase-api/deployments:
    get:
      operationId: getStarbaseDeployments
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
          required: false
          name: id
          in: query
        - schema:
            type: string
          required: false
          name: name
          in: query
        - schema:
            type: string
          required: false
          name: nameLike
          in: query
        - schema:
            type: string
          required: false
          name: source
          in: query
        - schema:
            type: array
            items:
              type: string
          required: false
          name: tenantIdIn
          in: query
        - schema:
            type: boolean
          required: false
          name: withoutTenantId
          in: query
        - schema:
            type: string
            enum:
              - id
              - name
              - deploymentTime
              - tenantId
          required: false
          name: sortBy
          in: query
        - schema:
            type: string
            enum:
              - asc
              - desc
          required: false
          name: sortOrder
          in: query
        - schema:
            type: number
          required: false
          name: firstResult
          in: query
        - schema:
            type: number
          required: false
          name: maxResults
          in: query
      responses:
        "200":
          description: List deployments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deployment"
      security:
        - BearerAuth: []
        - CookieAuth: []
    post:
      operationId: postStarbaseDeployments
      tags:
        - Starbase & Git
      responses:
        "501":
          description: Multipart deployment creation is not implemented on this route
      security:
        - BearerAuth: []
        - CookieAuth: []
  /starbase-api/deployments/{id}:
    get:
      operationId: getStarbaseDeploymentsById
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Get deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "404":
          description: Not found
      security:
        - BearerAuth: []
        - CookieAuth: []
    delete:
      operationId: deleteStarbaseDeploymentsById
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
        - schema:
            type: string
          required: false
          name: cascade
          in: query
      responses:
        "204":
          description: Deleted
      security:
        - BearerAuth: []
        - CookieAuth: []
  /starbase-api/process-definitions/{id}/diagram:
    get:
      operationId: getStarbaseProcessDefinitionsByIdDiagram
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Process diagram
          content:
            application/json:
              schema:
                nullable: true
      security:
        - BearerAuth: []
        - CookieAuth: []
  /git-api/repositories/init:
    post:
      operationId: postGitRepositoriesInit
      tags:
        - Starbase & Git
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitRepositoryRequest"
      responses:
        "201":
          description: Repository initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "403":
          description: Forbidden
      security:
        - BearerAuth: []
        - CookieAuth: []
  /git-api/repositories/clone:
    post:
      operationId: postGitRepositoriesClone
      tags:
        - Starbase & Git
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloneRepositoryRequest"
      responses:
        "201":
          description: Repository cloned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "403":
          description: Forbidden
      security:
        - BearerAuth: []
        - CookieAuth: []
  /git-api/repositories:
    get:
      operationId: getGitRepositories
      tags:
        - Starbase & Git
      responses:
        "200":
          description: List of repositories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Repository"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /git-api/repositories/{id}:
    get:
      operationId: getGitRepositoriesById
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Repository details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "404":
          description: Repository not found
      security:
        - BearerAuth: []
        - CookieAuth: []
    delete:
      operationId: deleteGitRepositoriesById
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "204":
          description: Repository deleted
        "404":
          description: Repository not found
      security:
        - BearerAuth: []
        - CookieAuth: []
  /git-api/deploy:
    post:
      operationId: postGitDeploy
      tags:
        - Starbase & Git
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeployRequest"
      responses:
        "201":
          description: Deployment successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentResponse"
        "403":
          description: Forbidden
      security:
        - BearerAuth: []
        - CookieAuth: []
  /git-api/rollback:
    post:
      operationId: postGitRollback
      tags:
        - Starbase & Git
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackRequest"
      responses:
        "200":
          description: Rollback successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                required:
                  - success
                  - message
        "403":
          description: Forbidden
      security:
        - BearerAuth: []
        - CookieAuth: []
  /git-api/commits:
    get:
      operationId: getGitCommits
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: projectId
          in: query
        - schema:
            type: string
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Commit history
          content:
            application/json:
              schema:
                nullable: true
        "400":
          description: Bad request
      security:
        - BearerAuth: []
        - CookieAuth: []
  /git-api/locks:
    post:
      operationId: postGitLocks
      tags:
        - Starbase & Git
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcquireLockRequest"
      responses:
        "201":
          description: Lock acquired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockResponse"
        "409":
          description: File locked by another user
      security:
        - BearerAuth: []
        - CookieAuth: []
    get:
      operationId: getGitLocks
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: projectId
          in: query
      responses:
        "200":
          description: Active locks
          content:
            application/json:
              schema:
                type: object
                properties:
                  locks:
                    type: array
                    items:
                      $ref: "#/components/schemas/LockResponse"
                required:
                  - locks
                additionalProperties: false
        "400":
          description: Bad request
      security:
        - BearerAuth: []
        - CookieAuth: []
  /git-api/locks/{lockId}:
    delete:
      operationId: deleteGitLocksByLockId
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: lockId
          in: path
      responses:
        "204":
          description: Lock released
      security:
        - BearerAuth: []
        - CookieAuth: []
  /starbase-api/projects/{projectId}/members/user-search:
    get:
      operationId: getStarbaseProjectsByProjectIdMembersUserSearch
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: projectId
          in: path
        - schema:
            type: string
          required: false
          name: q
          in: query
      responses:
        "200":
          description: Project member search results
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    email:
                      type: string
                    firstName:
                      type: string
                      nullable: true
                    lastName:
                      type: string
                      nullable: true
                  required:
                    - id
                    - email
      security:
        - BearerAuth: []
        - CookieAuth: []
  /starbase-api/projects/{projectId}/members/lookup:
    get:
      operationId: getStarbaseProjectsByProjectIdMembersLookup
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: projectId
          in: path
        - schema:
            type: string
            format: email
          required: false
          name: email
          in: query
      responses:
        "200":
          description: Project member candidate lookup
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                    enum:
                      - invite
                      - existing-member
                      - direct-add
                  user:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      firstName:
                        type: string
                        nullable: true
                      lastName:
                        type: string
                        nullable: true
                    required:
                      - id
                      - email
                required:
                  - mode
      security:
        - BearerAuth: []
        - CookieAuth: []
  /starbase-api/projects/{projectId}/members/capabilities:
    get:
      operationId: getStarbaseProjectsByProjectIdMembersCapabilities
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: projectId
          in: path
      responses:
        "200":
          description: Project member invitation capabilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  ssoRequired:
                    type: boolean
                  emailConfigured:
                    type: boolean
                required:
                  - ssoRequired
                  - emailConfigured
      security:
        - BearerAuth: []
        - CookieAuth: []
  /starbase-api/projects/{projectId}/members/{userId}/deploy-permission:
    put:
      operationId: putStarbaseProjectsByProjectIdMembersByUserIdDeployPermission
      tags:
        - Starbase & Git
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: projectId
          in: path
        - schema:
            type: string
            format: uuid
          required: true
          name: userId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
