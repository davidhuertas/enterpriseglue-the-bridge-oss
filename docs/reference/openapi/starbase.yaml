components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token returned by the login endpoints, sent as `Authorization: Bearer <token>`."
    CookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: Access token cookie set by the browser login flows. Mutating requests also need the XSRF header.
  schemas:
    AcquireLockRequest:
      type: object
      properties:
        fileId:
          type: string
          format: uuid
        force:
          type: boolean
        visibilityState:
          type: string
          enum:
            - visible
            - hidden
        hasInteraction:
          type: boolean
      required:
        - fileId
    CloneRepositoryRequest:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
        remoteUrl:
          type: string
          format: uri
        namespace:
          type: string
        conflictStrategy:
          type: string
          enum:
            - preferRemote
            - preferLocal
      required:
        - projectId
        - providerId
        - remoteUrl
    Comment:
      type: object
      properties:
        id:
          type: string
        fileId:
          type: string
        author:
          type: string
          nullable: true
        message:
          type: string
        createdAt:
          type: number
      required:
        - id
        - fileId
        - author
        - message
        - createdAt
    CompareVersionsResponse:
      type: object
      properties:
        versionA:
          $ref: "#/components/schemas/Version"
        versionB:
          $ref: "#/components/schemas/Version"
        diff:
          type: string
    CreateFileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        type:
          type: string
          enum:
            - bpmn
            - dmn
        folderId:
          type: string
          nullable: true
          format: uuid
        xml:
          type: string
      required:
        - name
    CreateFolderRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        parentFolderId:
          type: string
          nullable: true
          format: uuid
      required:
        - name
    CreateOnlineProjectResponse:
      type: object
      properties:
        project:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
          required:
            - id
            - name
        repository:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            fullName:
              type: string
            url:
              type: string
            cloneUrl:
              type: string
            private:
              type: boolean
          required:
            - id
            - name
            - fullName
            - url
            - cloneUrl
            - private
      required:
        - project
        - repository
    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        importFromEngine:
          type: object
          properties:
            enabled:
              type: boolean
            engineId:
              type: string
              minLength: 1
      required:
        - name
    CreateProjectResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        ownerId:
          type: string
        createdAt:
          type: number
        updatedAt:
          type: number
      required:
        - id
        - name
        - ownerId
        - createdAt
        - updatedAt
    DeployRequest:
