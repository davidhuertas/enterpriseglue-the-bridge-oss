components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token returned by the login endpoints, sent as `Authorization: Bearer <token>`."
    CookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: Access token cookie set by the browser login flows. Mutating requests also need the XSRF header.
  schemas:
    ActiveSourcesRequest:
      type: object
      properties:
        engineId:
          type: string
        processInstanceIds:
          type: array
          items:
            type: string
          default: []
      required:
        - engineId
      additionalProperties:
        nullable: true
    ActiveSourcesResponse:
      type: object
      additionalProperties:
        type: integer
        minimum: 0
    Batch:
      type: object
      properties:
        id:
          type: string
        camundaBatchId:
          type: string
          nullable: true
        type:
          type: string
        payload:
          type: string
          nullable: true
        totalJobs:
          type: number
          nullable: true
        jobsCreated:
          type: number
          nullable: true
        completedJobs:
          type: number
          nullable: true
        failedJobs:
          type: number
          nullable: true
        remainingJobs:
          type: number
          nullable: true
        invocationsPerBatchJob:
          type: number
          nullable: true
        seedJobDefinitionId:
          type: string
          nullable: true
        monitorJobDefinitionId:
          type: string
          nullable: true
        batchJobDefinitionId:
          type: string
          nullable: true
        status:
          type: string
        progress:
          type: number
          nullable: true
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: number
        updatedAt:
          type: number
        completedAt:
          type: number
          nullable: true
        lastError:
          type: string
          nullable: true
        suspended:
          type: boolean
      required:
        - id
        - camundaBatchId
        - type
        - payload
        - totalJobs
        - jobsCreated
        - completedJobs
        - failedJobs
        - remainingJobs
        - invocationsPerBatchJob
        - seedJobDefinitionId
        - monitorJobDefinitionId
        - batchJobDefinitionId
        - status
        - progress
        - createdBy
        - createdAt
        - updatedAt
        - completedAt
        - lastError
    BatchDetail:
      type: object
      properties:
        batch:
          $ref: "#/components/schemas/Batch"
        engine:
          type: object
          nullable: true
          properties:
            id:
              type: string
            totalJobs:
              type: number
              nullable: true
            jobsCreated:
              type: number
              nullable: true
            completedJobs:
              type: number
              nullable: true
            failedJobs:
              type: number
