openapi: 3.0.3
info:
  title: EnterpriseGlue Mission Control API
  version: 0.1.0
  description: |-
    Runtime operations against the process engine: definitions, instances, tasks, jobs, batches, migration and history.

    Tenant-scoped routes under `/api/t/{tenantSlug}/...` are also served at the legacy alias `/t/{tenantSlug}/api/...`; only the first form is documented.
servers:
  - url: /
    description: This EnterpriseGlue deployment
tags:
  - name: Mission Control
    description: "Runtime operations against the process engine: definitions, instances, tasks, jobs, batches, migration and history."
paths:
  /mission-control-api/process-definitions:
    get:
      operationId: getMissionControlProcessDefinitions
      tags:
        - Mission Control
      parameters:
        - schema:
            type: string
          required: false
          name: key
          in: query
        - schema:
            type: string
          required: false
          name: nameLike
          in: query
        - schema:
            type: string
          required: false
          name: latest
          in: query
      responses:
        "200":
          description: List process definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MissionControlProcessDefinition"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /mission-control-api/process-definitions/{id}:
    get:
      operationId: getMissionControlProcessDefinitionsById
      tags:
        - Mission Control
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Process definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionControlProcessDefinition"
        "404":
          description: Not found
      security:
        - BearerAuth: []
        - CookieAuth: []
  /mission-control-api/process-definitions/{id}/xml:
    get:
      operationId: getMissionControlProcessDefinitionsByIdXml
      tags:
        - Mission Control
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: BPMN XML
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionControlProcessDefinitionXml"
        "404":
          description: Not found
      security:
        - BearerAuth: []
        - CookieAuth: []
  /mission-control-api/process-definitions/resolve:
    get:
      operationId: getMissionControlProcessDefinitionsResolve
      tags:
        - Mission Control
      parameters:
        - schema:
            type: string
          required: true
          name: key
          in: query
        - schema:
            type: string
          required: true
          name: version
          in: query
      responses:
        "200":
          description: Resolved process definition
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                required:
                  - id
      security:
        - BearerAuth: []
        - CookieAuth: []
  /mission-control-api/process-definitions/edit-target:
    get:
      operationId: getMissionControlProcessDefinitionsEditTarget
      tags:
        - Mission Control
      parameters:
        - schema:
            type: string
          required: true
          name: engineId
          in: query
        - schema:
            type: string
          required: true
          name: key
          in: query
        - schema:
            type: string
          required: true
          name: version
          in: query
        - schema:
            type: string
          required: false
          name: processDefinitionId
          in: query
      responses:
        "200":
          description: Starbase file target for the deployed process version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessEditTarget"
        "404":
          description: No deployed process mapping found
      security:
        - BearerAuth: []
        - CookieAuth: []
  /mission-control-api/process-definitions/{id}/active-activity-counts:
    get:
      operationId: getMissionControlProcessDefinitionsByIdActiveActivityCounts
      tags:
        - Mission Control
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Active activity counts by activity ID
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: number
                  minimum: 0
      security:
        - BearerAuth: []
        - CookieAuth: []
  /mission-control-api/process-instances/preview-count:
    post:
      operationId: postMissionControlProcessInstancesPreviewCount
      tags:
        - Mission Control
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewCountRequest"
      responses:
        "200":
          description: Instance count matching filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationPreviewResponse"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /mission-control-api/process-instances:
    get:
      operationId: getMissionControlProcessInstances
      tags:
        - Mission Control
      parameters:
        - schema:
            type: string
          required: false
          name: engineId
          in: query
        - schema:
            type: string
          required: false
          name: processDefinitionKey
          in: query
        - schema:
            type: string
          required: false
          name: processDefinitionId
          in: query
        - schema:
            type: string
          required: false
          name: superProcessInstanceId
          in: query
        - schema:
            type: string
          required: false
          name: activityId
          in: query
        - schema:
            type: string
          required: false
          name: startedAfter
          in: query
        - schema:
            type: string
          required: false
          name: startedBefore
          in: query
        - schema:
            type: string
            enum:
              - "0"
              - "1"
              - "true"
              - "false"
          required: false
          name: active
          in: query
        - schema:
            type: string
            enum:
              - "0"
              - "1"
              - "true"
              - "false"
          required: false
          name: suspended
          in: query
        - schema:
            type: string
            enum:
              - "0"
              - "1"
              - "true"
              - "false"
          required: false
          name: withIncidents
          in: query
        - schema:
            type: string
            enum:
              - "0"
              - "1"
              - "true"
              - "false"
          required: false
          name: completed
          in: query
        - schema:
            type: string
            enum:
              - "0"
              - "1"
              - "true"
              - "false"
          required: false
          name: canceled
          in: query
        - schema:
            type: string
            enum:
              - "true"
          required: false
          name: includeActionDecisions
          in: query
        - schema:
            type: integer
            nullable: true
            minimum: 0
          required: false
          name: firstResult
          in: query
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
          required: false
          name: maxResults
          in: query
      responses:
        "200":
          description: List process instances (runtime + historic)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MissionControlProcessInstance"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /mission-control-api/process-instances/{id}:
    get:
      operationId: getMissionControlProcessInstancesById
      tags:
        - Mission Control
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Process instance details (runtime)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  processDefinitionKey:
                    type: string
                  businessKey:
                    type: string
                    nullable: true
                  version:
                    type: number
                  superProcessInstanceId:
                    type: string
                    nullable: true
                  rootProcessInstanceId:
                    type: string
                    nullable: true
                  startTime:
                    type: string
                    nullable: true
                  endTime:
                    type: string
                    nullable: true
                  state:
                    type: string
                    enum:
                      - ACTIVE
                      - SUSPENDED
                      - COMPLETED
                      - CANCELED
                      - INCIDENT
                  hasIncident:
                    type: boolean
                  runtimeActionDecisions:
                    type: object
                    properties:
                      suspension:
                        type: object
                        properties:
                          allowed:
                            type: boolean
                          reason:
                            type: string
                        required:
                          - allowed
                      retry:
                        type: object
                        properties:
                          allowed:
                            type: boolean
                          reason:
                            type: string
                        required:
                          - allowed
                      terminate:
                        type: object
                        properties:
                          allowed:
                            type: boolean
                          reason:
                            type: string
                        required:
                          - allowed
                      migration:
                        type: object
                        properties:
                          allowed:
                            type: boolean
                          reason:
                            type: string
                        required:
                          - allowed
                      modify:
                        type: object
                        properties:
                          allowed:
                            type: boolean
                          reason:
                            type: string
                        required:
                          - allowed
                      variablesUpdate:
                        type: object
                        properties:
                          allowed:
                            type: boolean
                          reason:
                            type: string
                        required:
                          - allowed
                    required:
                      - suspension
                      - retry
                      - terminate
                    additionalProperties:
                      nullable: true
                  processDefinitionId:
                    type: string
                  definitionId:
                    type: string
                  processDefinitionName:
                    type: string
                  processDefinitionVersion:
                    type: number
                required:
                  - id
                additionalProperties:
                  nullable: true
        "404":
          description: Not found
      security:
        - BearerAuth: []
        - CookieAuth: []
    delete:
      operationId: deleteMissionControlProcessInstancesById
      tags:
        - Mission Control
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "204":
          description: Deleted
      security:
        - BearerAuth: []
        - CookieAuth: []
  /mission-control-api/process-instances/{id}/variables:
    get:
      operationId: getMissionControlProcessInstancesByIdVariables
      tags:
        - Mission Control
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Process instance variables
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionControlVariables"
      security:
        - BearerAuth: []
        - CookieAuth: []
    post:
      operationId: postMissionControlProcessInstancesByIdVariables
      tags:
        - Mission Control
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                engineId:
                  type: string
                modifications:
                  type: object
                  additionalProperties:
                    nullable: true
              required:
                - modifications
      responses:
        "204":
          description: Variables modified
      security:
        - BearerAuth: []
        - CookieAuth: []
  /mission-control-api/process-instances/{id}/variable-history:
    get:
      operationId: getMissionControlProcessInstancesByIdVariableHistory
      tags:
        - Mission Control
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
        - schema:
            type: string
          required: true
          name: variableInstanceId
          in: query
        - schema:
            type: string
          required: false
          name: engineId
          in: query
      responses:
        "200":
          description: Variable history timeline for a process instance variable
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VariableHistoryEntry"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidQueryParametersResponse"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /mission-control-api/process-instances/{id}/history/activity-instances:
    get:
      operationId: getMissionControlProcessInstancesByIdHistoryActivityInstances
      tags:
        - Mission Control
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Historic activity instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MissionControlActivityInstance"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /mission-control-api/process-instances/{id}/execution-details:
    get:
      operationId: getMissionControlProcessInstancesByIdExecutionDetails
      tags:
        - Mission Control
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
        - schema:
            type: string
          required: true
          name: activityInstanceId
          in: query
        - schema:
            type: string
          required: false
          name: executionId
          in: query
        - schema:
            type: string
          required: false
          name: taskId
          in: query
      responses:
        "200":
          description: Lazy execution details for a process instance activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  activityInstanceId:
                    type: string
                  executionId:
                    type: string
                    nullable: true
                  taskId:
                    type: string
                    nullable: true
                  variables:
                    $ref: "#/components/schemas/HistoricVariableInstanceList"
                  tasks:
                    $ref: "#/components/schemas/HistoricTaskInstanceList"
                  decisions:
                    $ref: "#/components/schemas/HistoricDecisionInstanceList"
                  userOperations:
                    $ref: "#/components/schemas/UserOperationLogEntryList"
                required:
                  - activityInstanceId
                  - executionId
                  - taskId
                  - variables
                  - tasks
                  - decisions
                  - userOperations
                additionalProperties: false
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidQueryParametersResponse"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /mission-control-api/process-instances/{id}/incidents:
    get:
      operationId: getMissionControlProcessInstancesByIdIncidents
      tags:
        - Mission Control
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Incidents for an instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionControlProcessInstanceIncidentList"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /mission-control-api/process-instances/{id}/suspend:
    put:
      operationId: putMissionControlProcessInstancesByIdSuspend
      tags:
        - Mission Control
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "204":
          description: Suspended
      security:
        - BearerAuth: []
        - CookieAuth: []
  /mission-control-api/process-instances/{id}/activate:
    put:
      operationId: putMissionControlProcessInstancesByIdActivate
      tags:
        - Mission Control
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "204":
          description: Activated
      security:
        - BearerAuth: []
        - CookieAuth: []
  /mission-control-api/process-instances/{id}/retry:
    post:
      operationId: postMissionControlProcessInstancesByIdRetry
      tags:
        - Mission Control
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                engineId:
                  type: string
                jobIds:
                  type: array
                  items:
                    type: string
                externalTaskIds:
                  type: array
                  items:
                    type: string
                dueDate:
                  type: string
                retries:
                  type: integer
                  minimum: 0
      responses:
        "204":
          description: Retry requested
      security:
        - BearerAuth: []
        - CookieAuth: []
  /mission-control-api/history/process-instances:
    get:
      operationId: getMissionControlHistoryProcessInstances
      tags:
        - Mission Control
      parameters:
        - schema:
            type: string
          required: false
          name: superProcessInstanceId
          in: query
        - schema:
            type: string
          required: false
          name: processDefinitionKey
          in: query
      responses:
        "200":
          description: List historic process instances
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    processDefinitionKey:
                      type: string
                    businessKey:
                      type: string
                      nullable: true
                    version:
                      type: number
                    superProcessInstanceId:
                      type: string
                      nullable: true
                    rootProcessInstanceId:
                      type: string
                      nullable: true
                    startTime:
                      type: string
                      nullable: true
                    endTime:
                      type: string
                      nullable: true
                    state:
                      type: string
                      enum:
                        - ACTIVE
                        - SUSPENDED
                        - COMPLETED
                        - CANCELED
                        - INCIDENT
                    hasIncident:
                      type: boolean
                    runtimeActionDecisions:
                      type: object
                      properties:
                        suspension:
                          type: object
                          properties:
                            allowed:
                              type: boolean
                            reason:
                              type: string
                          required:
                            - allowed
                        retry:
                          type: object
                          properties:
                            allowed:
                              type: boolean
                            reason:
                              type: string
                          required:
                            - allowed
                        terminate:
                          type: object
                          properties:
                            allowed:
                              type: boolean
                            reason:
                              type: string
                          required:
                            - allowed
                        migration:
                          type: object
                          properties:
                            allowed:
                              type: boolean
                            reason:
                              type: string
                          required:
                            - allowed
                        modify:
                          type: object
                          properties:
                            allowed:
                              type: boolean
                            reason:
                              type: string
                          required:
                            - allowed
                        variablesUpdate:
                          type: object
                          properties:
                            allowed:
                              type: boolean
                            reason:
                              type: string
                          required:
                            - allowed
                      required:
                        - suspension
                        - retry
                        - terminate
                      additionalProperties:
                        nullable: true
                    processDefinitionId:
                      type: string
                    definitionId:
                      type: string
                    processDefinitionName:
                      type: string
                    processDefinitionVersion:
                      type: number
                  required:
                    - id
                  additionalProperties:
                    nullable: true
      security:
        - BearerAuth: []
        - CookieAuth: []
  /mission-control-api/history/process-instances/{id}:
    get:
      operationId: getMissionControlHistoryProcessInstancesById
      tags:
        - Mission Control
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Historic process instance details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  processDefinitionKey:
                    type: string
                  businessKey:
                    type: string
                    nullable: true
                  version:
                    type: number
                  superProcessInstanceId:
                    type: string
                    nullable: true
                  rootProcessInstanceId:
                    type: string
                    nullable: true
                  startTime:
                    type: string
                    nullable: true
                  endTime:
                    type: string
                    nullable: true
                  state:
                    type: string
                    enum:
                      - ACTIVE
                      - SUSPENDED
                      - COMPLETED
                      - CANCELED
                      - INCIDENT
                  hasIncident:
                    type: boolean
                  runtimeActionDecisions:
                    type: object
                    properties:
                      suspension:
                        type: object
                        properties:
                          allowed:
                            type: boolean
                          reason:
                            type: string
                        required:
                          - allowed
                      retry:
                        type: object
                        properties:
                          allowed:
                            type: boolean
                          reason:
                            type: string
                        required:
                          - allowed
                      terminate:
                        type: object
                        properties:
                          allowed:
                            type: boolean
                          reason:
                            type: string
                        required:
                          - allowed
                      migration:
                        type: object
                        properties:
                          allowed:
                            type: boolean
                          reason:
                            type: string
                        required:
                          - allowed
                      modify:
                        type: object
                        properties:
                          allowed:
                            type: boolean
                          reason:
                            type: string
                        required:
                          - allowed
                      variablesUpdate:
                        type: object
                        properties:
                          allowed:
                            type: boolean
                          reason:
                            type: string
                        required:
                          - allowed
                    required:
                      - suspension
                      - retry
                      - terminate
                    additionalProperties:
                      nullable: true
                  processDefinitionId:
                    type: string
                  definitionId:
                    type: string
                  processDefinitionName:
                    type: string
                  processDefinitionVersion:
                    type: number
                required:
                  - id
                additionalProperties:
                  nullable: true
        "404":
          description: Not found
      security:
        - BearerAuth: []
        - CookieAuth: []
  /mission-control-api/history/variable-instances:
    get:
      operationId: getMissionControlHistoryVariableInstances
      tags:
        - Mission Control
      parameters:
        - schema:
            type: string
          required: false
          name: processInstanceId
          in: query
        - schema:
            type: string
          required: false
          name: variableName
          in: query
      responses:
        "200":
          description: Historic variable instances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricVariableInstanceList"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /mission-control-api/batches/process-instances/delete:
    post:
      operationId: postMissionControlBatchesProcessInstancesDelete
      tags:
        - Mission Control
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeleteBatchRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchOperationCreateResponse"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /mission-control-api/batches/process-instances/suspend:
    post:
      operationId: postMissionControlBatchesProcessInstancesSuspend
      tags:
        - Mission Control
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSuspendActivateBatchRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchOperationCreateResponse"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /mission-control-api/batches/process-instances/activate:
    post:
      operationId: postMissionControlBatchesProcessInstancesActivate
      tags:
        - Mission Control
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSuspendActivateBatchRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchOperationCreateResponse"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /mission-control-api/batches/jobs/retries:
    post:
      operationId: postMissionControlBatchesJobsRetries
      tags:
        - Mission Control
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRetriesBatchRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchOperationCreateResponse"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /mission-control-api/batches:
    get:
      operationId: getMissionControlBatches
      tags:
        - Mission Control
      responses:
        "200":
          description: List batches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Batch"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /mission-control-api/batches/{id}/suspended:
    put:
      operationId: putMissionControlBatchesByIdSuspended
      tags:
        - Mission Control
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                suspended:
                  type: boolean
              required:
                - suspended
      responses:
        "204":
          description: Batch suspension state changed
      security:
        - BearerAuth: []
